<style>
/* Page-scoped layout only. Nothing here restyles a .wds- runtime class,
   and every colour comes from a token. */
.set-host {
  display: flex; min-height: 68vh; min-width: 0;
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-sys-shape-corner-large);
  overflow: hidden;
  background: var(--md-sys-color-surface);
}
.set-panel { padding: 20px; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.set-block { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.set-block > h2 { margin: 0; }
.set-block > h3 { margin: 8px 0 0; }
.set-rows { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.set-rows > * { padding-bottom: 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
.set-rows > *:last-child { border-bottom: 0; padding-bottom: 0; }
.set-swatch {
  width: 32px; height: 32px; flex: none;
  border-radius: var(--md-sys-shape-corner-small);
  border: 1px solid var(--md-sys-color-outline);
}
.set-preview {
  display: flex; flex-direction: column; gap: 12px;
  background: var(--md-sys-color-surface-container-low);
  border-radius: var(--md-sys-shape-corner-medium);
  padding: 16px;
}
.set-preview__line { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.set-preview__line > .i { margin-top: 2px; flex: none; }
.set-results { margin: 16px 0 24px; }
.set-rule { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.set-fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); }
.set-native {
  min-height: var(--wds-target-min); width: 100%;
  padding: 8px 12px; font: inherit; color: var(--md-sys-color-on-surface);
  background: var(--md-sys-color-surface-container-highest);
  border: 1px solid var(--md-sys-color-outline);
  border-radius: var(--md-sys-shape-corner-extra-small);
}
.set-native:focus-visible {
  outline: var(--wds-focus-width) solid var(--md-sys-color-secondary);
  outline-offset: var(--wds-focus-offset);
}
.set-days { display: flex; flex-wrap: wrap; gap: 8px; }
.set-code {
  font-family: var(--md-sys-typeface-mono);
  font-size: var(--md-sys-typescale-body-small-size);
  word-break: break-all;
}
@media (max-width: 760px) {
  .set-host { min-height: 0; border-radius: var(--md-sys-shape-corner-medium); }
  .set-panel { padding: 16px 12px; gap: 20px; }
}
</style>

  /* ================================================================
   * 3. The settings registry
   *
   * One descriptor per setting. The row on the page and the rich row
   * in the command palette are built from the SAME control factory,
   * so the two can never disagree about the value or about what
   * changing it does.
   * ================================================================ */
  var searchIndex = [];
  var paletteRegistered = Object.create(null);
  var TAB_LABELS = {};

  function settingInto(container, tabId, spec) {
    var control = spec.control();
    var row = S.settingRow({
      id: spec.id,
      label: spec.label,
      secondary: spec.secondary || '',
      explain: spec.explain,
      storageKey: spec.storageKey || null,
      shippedValue: spec.shippedValue,
      control: control,
      onReset: spec.onReset || null
    });
    container.appendChild(row);

    searchIndex.push({
      id: spec.id, tabId: tabId, label: spec.label,
      explain: spec.explain, keywords: spec.keywords || '',
      value: spec.value || function () { return ''; }
    });

    if (!paletteRegistered[spec.id]) {
      paletteRegistered[spec.id] = true;
      S.palette.register([{
        id: 'setting.' + spec.id,
        title: spec.label,
        subtitle: TAB_LABELS[tabId] || 'Settings',
        kind: 'setting',
        keywords: (spec.keywords || '') + ' ' + spec.explain,
        target: '[data-setting="' + spec.id + '"]',
        tabStrip: 'settings', tabId: tabId,
        control: spec.control
      }]);
    }
    return row;
  }

  /* A plain heading + paragraph block, so a section can explain itself
     without pretending to be a setting. */
  function block(title, paragraphs, children) {
    var node = el('div', { class: 'set-block' }, [el('h2', { text: title })]);
    (paragraphs || []).forEach(function (p) {
      node.appendChild(el('p', { class: 'muted', text: p }));
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }
  function rows() { return el('div', { class: 'set-rows' }); }
  function plain(text) { return el('p', { class: 'note--plain', text: text }); }

  /* ================================================================
   * 4. Tabs
   *
   * The settings surface is tabbed with the shared strip, carrying the
   * whole contract: any dock edge, overflow, reordering, pinning,
   * groups, the four searches, the bulk closes and persistence. "It is
   * only settings" is not an exemption.
   * ================================================================ */
  var TABS = [
    { id: 'language', labelKey: 'tab.language', icon: 'globe', keywords: 'english cantonese bilingual funny emoji vocabulary' },
    { id: 'appearance', labelKey: 'tab.appearance', icon: 'palette', keywords: 'theme dark light density colour accent font motion preset' },
    { id: 'navigation', labelKey: 'tab.navigation', icon: 'dock', keywords: 'tabs dock palette shortcut strip group' },
    { id: 'notifications', labelKey: 'tab.notifications', icon: 'bell', keywords: 'toast snackbar centre corner alerts' },
    { id: 'schedule', labelKey: 'tab.schedule', icon: 'calendar', keywords: 'rules time date weekday timezone home assistant api' },
    { id: 'locks', labelKey: 'tab.locks', icon: 'lock', keywords: 'password one-time code toy lock recovery' },
    { id: 'authenticator', labelKey: 'tab.authenticator', icon: 'key', keywords: 'totp otp qr two factor rfc 6238' },
    { id: 'history', labelKey: 'tab.history', icon: 'history', keywords: 'undo restore versions diff append only' },
    { id: 'school', labelKey: 'tab.school', icon: 'eye', keywords: 'school focus mode pin rename english only' },
    { id: 'storage', labelKey: 'tab.storage', icon: 'folder', keywords: 'privacy reset clear export dim sum photo network' }
  ];

  var panels = {};
  TABS.forEach(function (tb) {
    panels[tb.id] = el('div', { class: 'set-panel' });
    TAB_LABELS[tb.id] = t(tb.labelKey, tb.id);
  });

  var strip = S.tabs.create(document.getElementById('tabs-host'), {
    id: 'settings',
    dock: 'left',
    tabs: TABS.map(function (tb) {
      return {
        id: tb.id, labelKey: tb.labelKey, icon: tb.icon,
        panel: panels[tb.id], closable: true, keywords: tb.keywords
      };
    }),
    groups: [
      { id: 'g-text', name: 'Text and looks', colour: '#006D34', members: ['language', 'appearance'] },
      { id: 'g-safety', name: 'Locks and codes', colour: '#006973', members: ['locks', 'authenticator', 'school'] }
    ]
  });

  /* The dock lives inside the strip's own persisted record. A mirror
     key exists purely so the provenance line can name the real value
     rather than printing the entire tab record, and it is re-synced on
     every write so the two can never drift. */
  function syncDockMirror() {
    if (S.store.get('nav.dock', null) !== strip.dock()) S.store.set('nav.dock', strip.dock());
  }
  S.store.onChange(function (key) { if (key === 'tabs.settings') syncDockMirror(); });

  function renderVocabulary() {
    var lim = S.i18n.limits;
    var status = el('p', { role: 'status', 'aria-live': 'polite' });
    var fileInput = el('input', {
      class: 'set-native', type: 'file', accept: 'application/json,.json',
      'aria-describedby': 'vocab-status',
      onchange: function () {
        var f = fileInput.files && fileInput.files[0];
        if (!f) return;
        S.i18n.vocabulary.loadFile(f).then(function (res) {
          fileInput.value = '';
          if (res.ok) S.notify.success('Loaded ' + res.count + ' vocabulary entries. Nothing left this browser.');
          else S.notify.error(t('vocab.rejected', 'The file was refused') + ': ' + res.error);
          paint();
        });
      }
    });
    status.id = 'vocab-status';

    var clearBtn = el('button', {
      class: 'btn btn--outlined', type: 'button', text: t('act.reset', 'Clear'),
      onclick: function () {
        S.i18n.vocabulary.clear();
        S.notify.info('The vocabulary file was cleared. The original wording is back.');
        paint();
      }
    });

    function paint() {
      var st = S.i18n.vocabulary.status();
      clear(status);
      if (st.error) {
        status.appendChild(el('span', { class: 'status status--error' }, [el('span', { class: 'dot' }), 'Refused']));
        status.appendChild(document.createTextNode(' ' + st.error));
      } else if (st.loaded) {
        status.appendChild(el('span', { class: 'status status--ok' }, [el('span', { class: 'dot' }), 'Loaded']));
        status.appendChild(document.createTextNode(' ' + st.count + ' entries, read at ' + st.loadedAt + '.'));
      } else {
        status.appendChild(document.createTextNode(t('vocab.none', 'No vocabulary file loaded.')));
      }
      clearBtn.disabled = !st.loaded && !st.error;
      clearBtn.title = clearBtn.disabled ? 'There is no file loaded, so there is nothing to clear.' : '';
    }
    paint();

    var limitTable = el('div', { class: 'scrollx' }, el('table', { class: 'tbl' }, [
      el('thead', {}, el('tr', {}, [el('th', { text: 'Bound' }), el('th', { text: 'Limit' })])),
      el('tbody', {}, [
        ['File size', lim.maxBytes + ' bytes'],
        ['Schema version', String(lim.schemaVersion)],
        ['Entries', String(lim.maxEntries)],
        ['Key length', lim.maxKey + ' characters'],
        ['Value length', lim.maxValue + ' characters'],
        ['Nesting depth', String(lim.maxDepth)]
      ].map(function (r) {
        return el('tr', {}, [el('td', { text: r[0] }), el('td', { class: 'set-code', text: r[1] })]);
      }))
    ]));

    var sample = el('pre', {}, el('code', {
      text: '{\n  "schemaVersion": 1,\n  "entries": [\n    { "match": "world", "replace": "realm", "mode": "word", "lang": "en" }\n  ]\n}'
    }));

    var wrap = block(t('vocab.title', 'Personal vocabulary'), [
      'No mappings ship with this site. Wording changes only after you supply a file that passes every bound below, and a file that fails any of them is refused whole rather than applied in part.',
      'The file is read in this browser. There is no network request, and the file\'s name and path are never stored.'
    ], [
      el('div', { class: 'row' }, [fileInput, clearBtn]),
      status,
      limitTable,
      el('details', {}, [el('summary', { text: 'The file format' }), sample])
    ]);
    return wrap;
  }

  /* ================================================================
   * 9. Scheduled settings
   *
   * Versioned, bounded schema. Deterministic precedence. Explicit,
   * stated semantics for a cross-midnight window, for a zero-length
   * window and for partial input, rather than a silent guess.
   * ================================================================ */
  var SCHED_KEY = 'schedule.rules';
  var SCHED_BASE = 'schedule.base';
  var SCHED_VERSION = 1;

  var SCHED_SETTINGS = {
    'lang.mode': {
      label: 'Language mode', shipped: 'en',
      options: [{ value: 'en', label: 'English' }, { value: 'zh', label: 'Cantonese' }, { value: 'both', label: 'Both' }],

      set: function (v) { S.theme.setMode(v); }
    },
    'theme.density': {
      label: 'Density', shipped: 'comfortable',
      options: [{ value: 'comfortable', label: 'Comfortable' }, { value: 'compact', label: 'Compact' }, { value: 'dense', label: 'Dense' }],
      get: function () { return S.theme.density(); },
      set: function (v) { S.theme.setDensity(v); }
    },
    'theme.motion': {
      label: 'Motion', shipped: 'system',
      options: [{ value: 'system', label: 'As the system asks' }, { value: 'reduced', label: 'Reduced' }],
      get: function () { return S.theme.motion(); },
      set: function (v) { S.theme.setMotion(v); }
    },
    'theme.seed': {
      label: 'Accent colour', shipped: S.theme.seedDefault,
      options: null,
      get: function () { return S.theme.seed() || S.theme.seedDefault; },
      set: function (v) { S.theme.setSeed(v); }
    }
  };

  var WEEKDAY_IDS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  function weekdays() {
    var fmt = new Intl.DateTimeFormat(undefined, { weekday: 'long' });
    var out = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(2024, 0, 7 + i); /* 7 January 2024 is a Sunday. */
      out.push({ id: WEEKDAY_IDS[i], label: fmt.format(d) });
    }
    return out;
  }

  function schedRead() {
    var raw = S.store.get(SCHED_KEY, null);
    if (!raw || typeof raw !== 'object' || raw.schemaVersion !== SCHED_VERSION || !Array.isArray(raw.rules)) {
      return { schemaVersion: SCHED_VERSION, rules: [] };
    }
    return { schemaVersion: SCHED_VERSION, rules: raw.rules };
  }
  function schedWrite(doc) {
    S.store.set(SCHED_KEY, { schemaVersion: SCHED_VERSION, rules: doc.rules });
    S.history.record('schedule', 'Scheduled settings changed: ' + doc.rules.length + ' rule' + (doc.rules.length === 1 ? '' : 's'), { rules: doc.rules.length });
    schedEvaluate();
  }
  function toMinutes(hhmm) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || ''));
    if (!m) return null;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }
  function localDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function ruleMatches(rule, now) {
    if (!rule.enabled) return false;
    if (rule.source !== 'local') return false;
    if (!SCHED_SETTINGS[rule.setting]) return false;
    var ymd = localDate(now);
    if (rule.startDate && ymd < rule.startDate) return false;
    if (rule.endDate && ymd > rule.endDate) return false;
    if (rule.days !== 'every') {
      if (!Array.isArray(rule.days) || rule.days.indexOf(WEEKDAY_IDS[now.getDay()]) < 0) return false;
    }
    var mins = now.getHours() * 60 + now.getMinutes();
    var s = rule.startTime ? toMinutes(rule.startTime) : 0;
    var e = rule.endTime ? toMinutes(rule.endTime) : 1440;
    if (s === null) s = 0;
    if (e === null) e = 1440;
    if (s === e) return false;                       /* zero length: never matches */
    if (s < e) return mins >= s && mins < e;
    return mins >= s || mins < e;                    /* wraps past midnight */
  }
  /* Deterministic: the highest priority wins, and among equal
     priorities the rule further down the list wins. */
  function schedWinners(now) {
    var doc = schedRead();
    var out = {};
    doc.rules.forEach(function (rule, i) {
      if (!ruleMatches(rule, now)) return;
      var cur = out[rule.setting];
      if (!cur || rule.priority > cur.rule.priority || (rule.priority === cur.rule.priority && i > cur.index)) {
        out[rule.setting] = { rule: rule, index: i };
      }
    });
    return out;
  }
  function schedEvaluate() {
    var now = new Date();
    var winners = schedWinners(now);
    var base = S.store.get(SCHED_BASE, {}) || {};
    var changed = false;

    Object.keys(SCHED_SETTINGS).forEach(function (key) {
      var def = SCHED_SETTINGS[key];
      var win = winners[key];
      if (win) {
        if (!Object.prototype.hasOwnProperty.call(base, key)) {
          base[key] = S.store.get(key, null);
          changed = true;
        }
        if (def.get() !== win.rule.value) def.set(win.rule.value);
      } else if (Object.prototype.hasOwnProperty.call(base, key)) {
        var was = base[key];
        delete base[key];
        changed = true;
        if (was === null || was === undefined) { S.store.remove(key); def.set(def.shipped); }
        else def.set(was);
      }
    });
    if (changed) S.store.set(SCHED_BASE, base);
    return winners;
  }

  function ruleCard(rule, index) {
    function update(fn) {
      var d = schedRead();
      var r = d.rules.filter(function (x) { return x.id === rule.id; })[0];
      if (!r) return;
      fn(r);
      schedWrite(d);
    }

    var def = SCHED_SETTINGS[rule.setting] || SCHED_SETTINGS['theme.mode'];
    var valueHost = el('div');

    function buildValueControl() {
      clear(valueHost);
      var d2 = SCHED_SETTINGS[rule.setting];
      if (!d2) return;
      if (d2.options) {
        valueHost.appendChild(S.createSelect({
          label: 'Value', ariaLabel: 'Value for ' + d2.label, value: rule.value,
          storageKey: 'rule-value-' + rule.id,
          options: d2.options,
          onChange: function (v) { rule.value = v; update(function (r) { r.value = v; }); }
        }).el);
      } else {
        var swatch = el('span', { class: 'set-swatch', style: { 'background-color': rule.value } });
        var btn = el('button', {
          class: 'btn btn--outlined', type: 'button', text: 'Choose', 'aria-label': 'Choose the colour this rule holds',
          onclick: function () {
            var picker = S.appearance.colourPicker(rule.value, function () {});
            var h = S.overlay.open({
              anchor: btn, returnTo: btn, title: 'Colour for this rule', content: picker.el,
              footer: [
                el('button', { class: 'btn btn--text', type: 'button', text: t('act.cancel', 'Cancel'), onclick: function () { h.close('cancel'); } }),
                el('button', {
                  class: 'btn btn--filled', type: 'button', text: t('act.save', 'Save'),
                  onclick: function () {
                    rule.value = picker.value();
                    swatch.style.setProperty('background-color', rule.value);
                    update(function (r) { r.value = rule.value; });
                    h.close('save');
                  }
                })
              ]
            });
          }
        });
        valueHost.appendChild(el('div', { class: 'row' }, [swatch, btn]));
      }
    }
    buildValueControl();

    var labelInput = el('input', {
      class: 'set-native', type: 'text', value: rule.label, 'aria-label': 'A name for this rule',
      onchange: function () { update(function (r) { r.label = labelInput.value; }); }
    });
    var priorityInput = el('input', {
      class: 'set-native', type: 'number', min: '0', max: '99', step: '1', value: String(rule.priority),
      'aria-label': 'Priority for this rule',

        var n = Math.max(0, Math.min(99, parseInt(priorityInput.value, 10) || 0));

      }
    });

    var settingSel = S.createSelect({
      label: 'Setting', ariaLabel: 'Which setting this rule holds', value: rule.setting,

      }),

    var sourceSel = S.createSelect({

        },
        {

    var dayBox = el('div', { class: 'set-days', hidden: rule.days === 'every' });

      var on = rule.days !== 'every' && Array.isArray(rule.days) && rule.days.indexOf(d.id) >= 0;
      var chip = el('button', {
        class: 'chip' + (on ? ' is-sel' : ''), type: 'button', role: 'checkbox',

          chip.classList.toggle('is-sel', next);
          update(function (r) {
            var days = Array.isArray(r.days) ? r.days.slice() : [];
            if (next) { if (days.indexOf(d.id) < 0) days.push(d.id); }

      var s = rule.startTime ? toMinutes(rule.startTime) : 0;

        el('label', { class: 'field field--outlined' }, [el('span', { class: 'field__label', text: 'End date' }), endDate]),

        el('label', { class: 'field field--outlined' }, [el('span', { class: 'field__label', text: 'End time' }), endTime])
      ]),

        },

          run: function () { S.locks.wizard(card, 'schedule:rule:' + rule.id, 'Scheduled rule: ' + (rule.label || rule.id)); }

  /* ================================================================
   * 12. History
   * ================================================================ */
  var historyFilter = { from: null, to: null, actions: {} };

  function renderHistory(panel) {
    var entries = S.history.all();
    var actions = S.history.actions();

    var search = S.createSearchBar({
      ariaLabel: 'Search the history', placeholder: t('act.search', 'Search'),
      storageKey: 'history-page',
      help: 'Searches the description of every recorded change.',
      sampleProvider: function () { return entries.slice(0, 40).map(function (e) { return e.label; }).join('\n'); },
      onChange: function () { paint(); }
    });

    var picker = S.datePicker({
      from: historyFilter.from, to: historyFilter.to, range: true,
      onChange: function (from, to) { historyFilter.from = from; historyFilter.to = to; paint(); }
    });

    var actionBox = el('div', { class: 'set-days', role: 'group', 'aria-label': 'Filter by what was recorded' });
    actions.forEach(function (a) {
      var on = !!historyFilter.actions[a.action];
      var chip = el('button', {
        class: 'chip' + (on ? ' is-sel' : ''), type: 'button', role: 'checkbox',
        'aria-checked': on ? 'true' : 'false',
        text: a.action + ' (' + a.count + ')',
        onclick: function () {
          var next = chip.getAttribute('aria-checked') !== 'true';
          chip.setAttribute('aria-checked', next ? 'true' : 'false');
          chip.classList.toggle('is-sel', next);
          historyFilter.actions[a.action] = next;
          paint();
        }
      });
      actionBox.appendChild(chip);
    });
    if (!actions.length) actionBox.appendChild(el('p', { class: 'muted', text: 'Nothing has been recorded yet, so there is nothing to filter by.' }));

    var listWrap = el('div');
    var filterHost = el('div', { class: 'stack' }, [search.el, picker.el, actionBox]);

    function visible() {
      var m = search.matcher();
      var chosen = Object.keys(historyFilter.actions).filter(function (k) { return historyFilter.actions[k]; });
      return entries.filter(function (e) {
        if (chosen.length && chosen.indexOf(e.action) < 0) return false;
        if (historyFilter.from && new Date(e.at) < startOfDay(historyFilter.from)) return false;
        if (historyFilter.to && new Date(e.at) > endOfDay(historyFilter.to)) return false;
        return m(e.label + ' ' + e.action);
      });
    }
    function startOfDay(d) { var x = new Date(d.getTime()); x.setHours(0, 0, 0, 0); return x; }
    function endOfDay(d) { var x = new Date(d.getTime()); x.setHours(23, 59, 59, 999); return x; }

    var collapseCtl = null;

    function paint() {
      var rowsOut = visible();
      clear(listWrap);

      if (collapseCtl) {
        var chosen = Object.keys(historyFilter.actions).filter(function (k) { return historyFilter.actions[k]; });
        var bits = [];
        if (search.value()) bits.push('a text search');
        if (historyFilter.from || historyFilter.to) bits.push('a date range');
        if (chosen.length) bits.push(chosen.length + ' action filter' + (chosen.length === 1 ? '' : 's'));
        collapseCtl.setActiveSummary(bits.length ? ('Excluding entries: ' + bits.join(', ')) : '');
      }

      if (!rowsOut.length) {
        listWrap.appendChild(el('p', { class: 'muted', text: entries.length ? t('msg.noMatch', 'Nothing matches those filters.') : 'Nothing has been recorded yet.' }));
        return;
      }

      var ul = el('ul', { class: 'list', role: 'listbox', 'aria-label': 'History entries', 'aria-multiselectable': 'true' });
      rowsOut.slice(0, 80).forEach(function (e) {
        var diff = S.history.diff(e.id) || [];
        var details = el('details', {}, [
          el('summary', { text: diff.length ? ('What changed (' + diff.length + ')') : 'What changed (nothing recorded)' }),
          diff.length
            ? el('div', { class: 'scrollx' }, el('table', { class: 'tbl' }, [
                el('thead', {}, el('tr', {}, [el('th', { text: 'Key' }), el('th', { text: 'Before' }), el('th', { text: 'After' })])),
                el('tbody', {}, diff.map(function (d) {
                  return el('tr', {}, [
                    el('td', { class: 'set-code', text: d.key }),
                    el('td', { class: 'set-code', text: String(d.before) }),
                    el('td', { class: 'set-code', text: String(d.after) })
                  ]);
                }))
              ]))
            : el('p', { class: 'muted', text: 'This entry recorded no difference against the one before it.' })
        ]);

        ul.appendChild(el('li', {
          class: 'li', 'data-bulk-item': '', 'data-id': e.id, tabindex: '0', role: 'option', 'aria-selected': 'false',
          style: { 'align-items': 'flex-start', 'flex-wrap': 'wrap' }
        }, [
          el('span', { class: 'cbx', 'data-bulk-check': '', role: 'checkbox', 'aria-checked': 'false', 'aria-label': 'Select this entry' }),
          el('div', { class: 'li__t' }, [
            el('div', { class: 'li__h', text: e.label }),
            el('div', { class: 'li__s', text: e.action + ' · ' + e.at }),
            details
          ]),
          el('button', {
            class: 'btn btn--outlined', type: 'button', text: t('act.restore', 'Restore'),
            'aria-label': t('act.restore', 'Restore') + ': ' + e.label,
            onclick: function (ev) {
              var btn = ev.currentTarget;
              S.confirm({
                anchor: btn, returnTo: btn,
                action: 'Restore the settings from this entry',
                target: e.label,
                facts: [{ k: 'Recorded', v: e.at }, { k: 'Kind', v: e.action }, { k: 'Differences', v: String(diff.length) }],
                detail: 'History is append-only, so this restore is written as a new entry and can itself be undone.',
                irreversible: false
              }).then(function (ok) {
                if (!ok) return;
                S.history.restore(e.id);
                S.notify.success('Restored the settings recorded at ' + e.at + '. The restore was itself recorded.');
                render();
              });
            }
          })
        ]));
      });
      listWrap.appendChild(ul);
      if (rowsOut.length > 80) {
        listWrap.appendChild(el('p', { class: 'muted t-body-small', text: 'Showing the newest 80 of ' + rowsOut.length + ' matching entries.' }));
      }

      S.bulk.attach(ul, {
        getLabel: function (id) {
          var e = entries.filter(function (x) { return x.id === id; })[0];
          return e ? e.label : id;
        },
        allMatchingCount: function () { return rowsOut.length; },
        allMatchingIds: function () { return rowsOut.map(function (e) { return e.id; }); },
        actions: [
          {
            id: 'export', label: t('act.export', 'Export'),
            run: function (ids) {
              S.exportDialog(entries.filter(function (e) { return ids.indexOf(e.id) >= 0; })
                .map(function (e) { return { at: e.at, action: e.action, label: e.label }; }),
                { name: 'history', anchor: ul, omitted: 'The stored snapshot of each entry is left out; this file is the log of what happened.' });
            }
          },
          {
            id: 'label', label: 'Label',
            run: function (ids) {
              var text = window.prompt('A label for ' + ids.length + ' entr' + (ids.length === 1 ? 'y' : 'ies') + ':', '');
              if (text === null) return { done: 0, skipped: ids.length, reason: 'cancelled' };
              ids.forEach(function (id) { S.history.label(id, text); });
              window.setTimeout(render, 0);
            }
          }
        ]
      });
    }

    var wrap = block(t('history.title', 'History'), [
      t('history.appendOnly', ''),
      'The desktop application keeps this in a local Git repository inside its own data folder. A web page has no such folder, so this site keeps the same append-only log in browser storage and says so rather than implying a repository exists.'
    ], [filterHost, listWrap, el('div', { class: 'row' }, [
      el('button', {
        class: 'btn btn--outlined', type: 'button', text: 'Open the history panel',
        onclick: function (e) { S.history.open(e.currentTarget); }
      }),
      el('button', {
        class: 'btn btn--text', type: 'button', text: 'Prune to the newest 100',
        onclick: function (e) {
          var btn = e.currentTarget;
          S.confirm({
            anchor: btn, returnTo: btn, action: 'Prune the history', target: 'everything older than the newest 100 entries',
            facts: [{ k: 'Entries now', v: String(entries.length) }, { k: 'Kept', v: '100' }],
            detail: 'The pruned entries cannot be brought back, and the states they recorded can no longer be restored.',
            irreversible: true
          }).then(function (ok) {
            if (!ok) return;
            S.history.prune(100);
            S.notify.success('History pruned to the newest 100 entries.');
            render();
          });
        }
      })
    ])]);

    panel.appendChild(wrap);
    collapseCtl = S.collapse.attach(filterHost, {
      title: 'Filters', descriptive: true, storageKey: 'history-filters'
    });
    paint();
  }

      storageKey: 'school.cred',

    });

    ], [reqList]));

    if (!keys.length) {

    } else {

        }, [

          ])
        ]));
      });

        S.confirm({
          anchor: clearBtn, returnTo: clearBtn,
          action: 'Clear everything this site stored in this browser',
          target: keys.length + ' key' + (keys.length === 1 ? '' : 's') + ' at ' + S.privacy.origin,
          facts: [
            { k: 'Keys', v: String(keys.length) },
            { k: 'Approximate size', v: S.store.bytes() + ' bytes' },

          ],

        }).then(function (ok) {
          if (!ok) return;
          var n = S.privacy.clearAll();
          S.notify.success('Cleared ' + n + ' stored values. Reload the page to start from the shipped defaults.');
          window.setTimeout(function () { window.location.reload(); }, 1200);
        });
      }
    });

    panel.appendChild(block('What is stored', [
      S.privacy.note,
      st.available ? ('Storage is working. About ' + S.store.bytes() + ' bytes are in use across ' + keys.length + ' keys.')
                   : ('Storage is not available: ' + st.note + ' Settings will work for this page and will not survive a reload.')
    ], [
      keyList,
      el('div', { class: 'row' }, [
        el('button', {
          class: 'btn btn--outlined', type: 'button', text: 'Export everything',
          onclick: function (e) {
            S.exportDialog(S.store.keys().map(function (k) { return { key: k, value: JSON.stringify(S.store.get(k, null)) }; }),
              {
                name: 'world-downloader-studio-site-settings', anchor: e.currentTarget,
                omitted: 'Lock passwords and authenticator secrets are left out of this file.'

        }),

        }),

      ])
    ]));

    if (keys.length) {
      S.bulk.attach(keyList, {
        getLabel: function (id) { return S.privacy.storagePrefix + id; },
        allMatchingCount: function () { return keys.length; },
        allMatchingIds: function () { return keys.slice(); },
        actions: [
          {
            id: 'export', label: t('act.export', 'Export'),
            run: function (ids) {
              S.exportDialog(ids.map(function (k) { return { key: k, value: JSON.stringify(S.store.get(k, null)) }; }),
                { name: 'stored-keys', anchor: keyList });
            }
          },
          {
            id: 'remove', label: t('act.remove', 'Remove'), danger: true, destructive: true,
            run: function (ids) {
              ids.forEach(function (k) { S.store.remove(k); });
              window.setTimeout(function () { window.location.reload(); }, 600);
              return { done: ids.length, skipped: 0 };
            }
          }
        ]
      });
    }
  }

  /* ================================================================
   * 15. The settings search
   *
   * One search across every tab. When a match sits on a tab other than
   * the one showing, the result says which tab it is on rather than
   * leaving the visitor to conclude the setting does not exist.
   * ================================================================ */
  var resultsHost = document.getElementById('search-results');

  var search = S.createSearchBar({
    label: t('set.searchLabel', 'Search every setting'),
    placeholder: t('act.search', 'Search'),
    storageKey: 'settings-page',
    help: t('set.searchHelp', ''),
    sampleProvider: function () {
      return searchIndex.map(function (s) { return s.label + ' — ' + s.value(); }).join('\n');
    },
    onChange: function () { paintResults(); }
  });
  document.getElementById('search-host').appendChild(search.el);

  function paintResults() {
    var q = search.value();
    clear(resultsHost);
    if (!q) { resultsHost.hidden = true; return; }
    resultsHost.hidden = false;

    var m = search.matcher();
    var hits = searchIndex.filter(function (s) {
      return m(s.label + ' ' + s.explain + ' ' + s.keywords + ' ' + s.value() + ' ' + (TAB_LABELS[s.tabId] || ''));
    });

    if (!hits.length) {
      resultsHost.appendChild(el('p', { class: 'muted', text: t('set.noMatch', 'No setting matches that.') }));
      return;
    }

    var current = strip.selected();
    var elsewhere = hits.filter(function (h) { return h.tabId !== current; });

    resultsHost.appendChild(el('p', {
      class: 'muted t-body-small',
      text: hits.length + ' setting' + (hits.length === 1 ? '' : 's') + ' match. ' +
        (elsewhere.length
          ? t('set.matchesElsewhere', '') + ' ' + elsewhere.length + ' of them are on: ' +
            elsewhere.map(function (h) { return TAB_LABELS[h.tabId]; })
              .filter(function (v, i, a) { return a.indexOf(v) === i; }).join(', ') + '.'
          : 'All of them are on the tab you are looking at.')
    }));

    var ul = el('ul', { class: 'list', role: 'listbox', 'aria-label': 'Matching settings', 'aria-multiselectable': 'true' });
    hits.forEach(function (h) {
      ul.appendChild(el('li', {
        class: 'li', 'data-bulk-item': '', 'data-id': h.id, tabindex: '0', role: 'option', 'aria-selected': 'false'
      }, [
        el('span', { class: 'cbx', 'data-bulk-check': '', role: 'checkbox', 'aria-checked': 'false', 'aria-label': 'Select ' + h.label }),
        el('div', { class: 'li__t' }, [
          el('div', { class: 'li__h', text: h.label }),
          el('div', { class: 'li__s', text: TAB_LABELS[h.tabId] + ' · currently ' + (h.value() || 'unset') })
        ]),
        el('button', {
          class: 'btn btn--tonal', type: 'button', text: 'Go to it',
          'aria-label': 'Go to ' + h.label + ' on the ' + TAB_LABELS[h.tabId] + ' tab',
          onclick: function () { goTo(h); }
        })
      ]));
    });
    resultsHost.appendChild(ul);

    S.bulk.attach(ul, {
      getLabel: function (id) {
        var h = searchIndex.filter(function (x) { return x.id === id; })[0];
        return h ? h.label : id;
      },
      allMatchingCount: function () { return hits.length; },
      allMatchingIds: function () { return hits.map(function (h) { return h.id; }); },
      actions: [
        {
          id: 'export', label: t('act.export', 'Export'),
          run: function (ids) {
            S.exportDialog(searchIndex.filter(function (h) { return ids.indexOf(h.id) >= 0; })
              .map(function (h) { return { setting: h.id, label: h.label, section: TAB_LABELS[h.tabId], value: h.value(), explanation: h.explain }; }),
              { name: 'settings', anchor: ul });
          }
        }
      ]
    });
  }

  function goTo(hit) {
    strip.select(hit.tabId);
    window.setTimeout(function () {
      var node = document.querySelector('[data-setting="' + hit.id + '"]');
      if (!node) { S.notify.warn('That setting is on the ' + TAB_LABELS[hit.tabId] + ' tab, but its row is not on the page right now.'); return; }
      var p = node.parentElement;
      while (p) {
        if (p.tagName === 'DETAILS' && !p.open) p.open = true;
        if (p.classList && p.classList.contains('wds-collapse') && p.dataset.open === 'false') p.dataset.open = 'true';
        p = p.parentElement;
      }
      node.scrollIntoView({ block: 'center', behavior: S.a11y.reducedMotion() ? 'auto' : 'smooth' });
      var focusable = node.querySelector('button,input,select,textarea,a,[tabindex]');
      if (focusable) { try { focusable.focus({ preventScroll: true }); } catch (e) { focusable.focus(); } }
      S.flash(node);
    }, 60);
  }

  /* ================================================================
   * 16. Render
   *
   * Everything re-renders when the language, the funny level or the
   * focus mode changes, because an explanation written at one level
   * would otherwise sit there in the voice of the level before.
   * ================================================================ */
  var BUILDERS = {
    language: renderLanguage,
    appearance: renderAppearance,
    navigation: renderNavigation,
    notifications: renderNotifications,
    schedule: renderSchedule,
    locks: renderLocks,
    authenticator: renderAuthenticator,
    history: renderHistory,
    school: renderSchool,
    storage: renderStorage
  };

  var rendering = false;
  function render() {
    if (rendering) return;
    rendering = true;

    var activeRow = document.activeElement && document.activeElement.closest
      ? document.activeElement.closest('[data-setting]') : null;
    var restoreId = activeRow ? activeRow.getAttribute('data-setting') : null;

    searchIndex.length = 0;
    TABS.forEach(function (tb) {
      TAB_LABELS[tb.id] = t(tb.labelKey, tb.id);
      var panel = panels[tb.id];
      clear(panel);
      try { BUILDERS[tb.id](panel); }
      catch (e) {
        panel.appendChild(el('p', { class: 'note note--warn', text: 'This section failed to build: ' + e.message }));
        if (window.console && window.console.error) window.console.error(e);
      }
      /* The whole section is an appearance target and a lock target,
         with its own context menu, exactly like every other element. */
      S.appearance.enable(panel, 'settings:tab:' + tb.id, TAB_LABELS[tb.id]);
      S.contextMenu(panel, function () {
        var key = 'settings:tab:' + tb.id;
        return [
          {
            label: t('act.openEditor', 'Edit appearance') + '…', icon: 'palette', shortcut: 'Shift+Right click',
            run: function () { S.appearance.openEditor(panel, key, TAB_LABELS[tb.id]); }
          },
          {
            label: t('locks.lockThis', 'Lock this element') + '…', icon: 'lock',
            run: function () { S.locks.wizard(panel, key, TAB_LABELS[tb.id]); }
          },
          '-',
          { label: t('act.search', 'Search') + ' every setting', icon: 'search', run: function () { search.focus(); } },
          { label: t('palette.title', 'Command palette'), icon: 'grid', shortcut: 'Ctrl+Shift+F', run: function () { S.palette.open(); } }
        ];
      }, { ariaLabel: TAB_LABELS[tb.id] + ' menu', storageKey: 'panel-' + tb.id });

      if (S.locks.isLocked('settings:tab:' + tb.id) && !S.locks.isUnlocked('settings:tab:' + tb.id)) {
        S.locks.veil(panel, 'settings:tab:' + tb.id, TAB_LABELS[tb.id]);
      }
    });

    strip.refresh();
    paintPageCopy();
    buildAppbarActions();
    paintResults();

    if (restoreId) {
      var back = document.querySelector('[data-setting="' + restoreId + '"]');
      var f = back && back.querySelector('button,input,select,textarea,[tabindex]');
      if (f) { try { f.focus({ preventScroll: true }); } catch (e) { /* focus is a convenience here */ } }
    }
    rendering = false;
  }

  /* ================================================================
   * 17. Page-level palette entries and boot
   * ================================================================ */
  S.palette.register([
    { id: 'page.settings', title: 'Settings', subtitle: 'This page', kind: 'page', page: 'settings.html', keywords: 'settings preferences options configure' },
    { id: 'page.settings.search', title: 'Search every setting', subtitle: 'Settings', kind: 'command', run: function () { search.focus(); } }
  ].concat(TABS.map(function (tb) {
    return {
      id: 'settings.tab.' + tb.id,
      title: t(tb.labelKey, tb.id),
      subtitle: 'Settings',
      kind: 'destination',
      keywords: tb.keywords,
      page: 'settings.html',
      tabStrip: 'settings', tabId: tb.id,
      target: '[data-wds-akey="settings:tab:' + tb.id + '"]',
      locked: 'settings:tab:' + tb.id
    };
  })));

  S.on('i18n', function () { render(); });
  S.on('school', function () { render(); });
  S.on('vocab', function () { render(); });

  render();
  schedEvaluate();
  window.setInterval(function () { schedEvaluate(); }, 30000);
});
</script>
</body>
</html>
