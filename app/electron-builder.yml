appId: com.worlddownloaderstudio.app
productName: World Downloader Studio
copyright: World Downloader Studio contributors

# Code signing is permanently out of scope for this project. These three keys are
# stated explicitly so no tool can silently discover a certificate and sign the
# artifacts. The published installer is unsigned and Windows will show an
# unknown-publisher warning; that is expected and documented in the release notes.
forceCodeSigning: false

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  # Production dependencies must travel with the build: the main process keeps
  # them external rather than bundling them, so anything in `dependencies` is
  # resolved from node_modules at runtime and has to be inside the package.
  # Naming `files` at all replaces the default pattern, so this line is what
  # keeps them; without it a feature's runtime dependency is missing only in the
  # installed build, which is the worst place to discover it.
  - node_modules/**/*
  - '!**/*.map'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,README,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
  - '!**/node_modules/*.d.ts'

asar: true
asarUnpack: []

# The Java engine the desktop application actually spawns to download a world.
# The application is not a second product beside the jar — it is the UI that
# drives it, so a release of the application without the engine it runs ships
# half a thing.
#
# The jar is built SEPARATELY by Maven (`mvn -B -ntp clean package -DskipTests`,
# run from the repository root, i.e. one directory above this file) before this
# packaging step runs. electron-builder only copies the artifact Maven already
# produced; it does not build it and does not know how to. Both the release
# workflow (.github/workflows/release.yml) and the local installer build engine
# (scripts/windows-build.ps1) run the Maven build first for exactly this reason,
# so a locally built installer carries the same jar a released one does.
#
# `world-downloader.jar` is the shaded jar's real name: pom.xml pins
# `<finalName>world-downloader</finalName>` on the shade plugin, and the shade
# plugin replaces target/world-downloader.jar with the fully-shaded artifact
# during `package` — verified locally (mvn ... package -DskipTests produced
# exactly target/world-downloader.jar, 14,055,418 bytes). If that finalName ever
# changes, this path and the release workflow's collection step both need
# updating together, or packaging will fail loudly on a missing source file
# rather than silently shipping an application with no engine.
#
# Packaged location: resources/engine/world-downloader.jar, i.e.
# `path.join(process.resourcesPath, 'engine', 'world-downloader.jar')` at
# runtime. This is meant to become the renderer's DEFAULT jar location — the
# user's own "Jar path" setting still wins when they set one. That renderer/main
# change is NOT made in this file; see docs/features/deployment-ci.md for the
# exact change a sibling owns.
extraResources:
  - from: ../target/world-downloader.jar
    to: engine/world-downloader.jar
  # Build-time-fetched runtime tools: a trimmed Java runtime (JRE) and MinGit,
  # and optionally the GitHub CLI. Without these the application still runs --
  # it falls back to PATH exactly as it does for the two above -- but bundling
  # them is what lets a machine with NOTHING installed still download a world
  # and use the World Vault feature, with no browser link ever shown for a
  # dependency the application itself needs.
  #
  # `scripts/fetch-dependencies.mjs` downloads, verifies each archive against
  # the pinned SHA-256 in `scripts/dependency-manifest.json`, and unpacks them
  # into `resources/runtime/**` BEFORE this file is ever read by
  # electron-builder -- wired as `predist` / `predist:dir` in package.json (so
  # a bare `npm run dist` self-heals) and as its own explicit, reported phase
  # in the repository's `scripts/windows-build.ps1`.
  #
  # Packaged location -- the fixed path contract `src/main/services/bundled.ts`
  # resolves against:
  #   resources/runtime/jre/bin/java.exe
  #   resources/runtime/git/cmd/git.exe
  #   resources/runtime/gh/bin/gh.exe   (only present when fetched with --with-gh)
  #
  # electron-builder fails loudly on a missing `from` directory rather than
  # silently skipping it, so a build that reaches this step without having
  # run fetch-dependencies.mjs first stops right here -- run
  # `node scripts/fetch-dependencies.mjs` in `app/` to populate it.
  - from: resources/runtime
    to: runtime
  # The standalone Scraper bot project (`../scraper`, one directory above
  # this file -- its own package.json, its own node_modules, scrape.js) so
  # the *Scraper bot* tab works on a machine that has never had Node.js
  # installed. The application spawns this with a Node interpreter it
  # resolves itself -- this installation's own embedded Electron runtime
  # first, falling back to a system `node` on PATH only when that is somehow
  # unusable (`src/main/services/node-runtime.ts`) -- so the only thing that
  # actually needs to be IN the installer is the project's own files and its
  # own installed dependencies.
  #
  # electron-builder fails loudly on a missing `from` directory exactly as
  # it does for `runtime` above, but that alone is not enough here: it would
  # still happily copy a `scraper/` whose own `npm install` was never run,
  # producing an installer whose bot starts and immediately fails with
  # "Cannot find module 'mineflayer'". `scripts/check-scraper-bundle.mjs`
  # (wired as part of `predist` / `predist:dir` in package.json, run BEFORE
  # this file is ever read) is what actually catches that: it fails the
  # build loudly, naming the exact missing package, rather than letting a
  # non-functional bot ship silently.
  #
  # Packaged location: resources/scraper/scrape.js, matching the fixed path
  # contract `src/main/services/bundled.ts`'s `scraperScript` bundled tool
  # resolves against, and the directory `renderer/features/bot/runner.ts`'s
  # `directoryFor` falls back to (via that same channel) when neither a
  # profile nor the feature-wide setting names a scraper directory.
  - from: ../scraper
    to: scraper

electronLanguages:
  - en-US

win:
  icon: build/icon.ico
  # Skip signing, keep resource editing.
  #
  # `signAndEditExecutable: false` was here first and it skips BOTH — which packaged an executable
  # carrying the default framework icon and no version metadata. electron-builder says so in its
  # own log line: "executable resource editing and code signing skipped — signAndEditExecutable is
  # false. To skip only code signing while keeping icon and metadata applied, use signExecutable:
  # false instead."
  #
  # Code signing stays permanently out of scope, which `signExecutable: false` and
  # `forceCodeSigning: false` above both state, and which the release workflow reinforces by
  # clearing every CSC_* input and disabling certificate auto-discovery. Applying an icon and a
  # version string to the executable is not signing it, and shipping the framework's default icon
  # would fail this project's own requirement for a real packaged application icon.
  signExecutable: false
  target:
    - target: squirrel
      arch:
        - x64

squirrelWindows:
  artifactName: ${productName}-Setup-${version}.${ext}
  msi: false
  # Squirrel requires this and refuses to build without it: "squirrelWindows.iconUrl is not
  # specified". It is fetched at INSTALL time for the Add/Remove Programs entry, not at build time,
  # so it must be a public HTTPS URL rather than a local path. It points at the committed icon on
  # the default branch; if it ever fails to resolve, the consequence is a missing icon in one
  # Windows list, never a failed build or a failed install.
  iconUrl: https://raw.githubusercontent.com/Ding-Ding-Projects/minecraft-world-downloader/main/app/build/icon.ico

publish: null
