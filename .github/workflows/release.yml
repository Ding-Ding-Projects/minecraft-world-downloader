name: All-in-one release

# Builds the downloader jar AND the desktop manager, bundles the jar + docker-compose + full
# source into the NSIS installer, and publishes a GitHub release (installer + jar + source zip)
# on every push to main and on manual dispatch.

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---- downloader jar (JDK 21) ----
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build downloader jar
        run: mvn -B -ntp clean package -DskipTests

      - name: Test downloader
        run: mvn -B -ntp test -DskipTests=false

      # ---- desktop manager (self-contained win-x64) ----
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: '"version=1.0.${{ github.run_number }}" >> $env:GITHUB_OUTPUT'

      - name: Add this build to the offline changelog
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: >
          ./desktop/Resources/Add-CiRelease.ps1
          -Tag "build-${{ github.run_number }}"
          -Version "${{ steps.ver.outputs.version }}"
          -CommitSha "${{ github.sha }}"

      - name: Test desktop manager
        run: dotnet test desktop.tests/WorldDownloaderManager.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish desktop app
        shell: pwsh
        run: >
          dotnet publish desktop/WorldDownloaderManager.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version="${{ steps.ver.outputs.version }}"
          -p:FileVersion="${{ steps.ver.outputs.version }}.0"
          -p:AssemblyVersion="${{ steps.ver.outputs.version }}.0"
          -p:InformationalVersion="${{ steps.ver.outputs.version }}+${{ github.sha }}"
          -o "${{ github.workspace }}\publish"

      # ---- bundle the jar + compose + full source INTO the installer payload ----
      - name: Bundle extras into installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "publish\resources" | Out-Null
          Copy-Item "target\world-downloader.jar" "publish\resources\world-downloader.jar"
          if (Test-Path "docker-compose.yml") { Copy-Item "docker-compose.yml" "publish\resources\docker-compose.yml" }
          Copy-Item "bluemap" "publish\bluemap" -Recurse
          Copy-Item "scraper" "publish\scraper" -Recurse
          git archive --format=zip -o "publish\resources\source.zip" HEAD
          $required = @(
            "publish\bluemap\pipeline.py",
            "publish\scraper\scrape.js",
            "publish\scraper\package.json",
            "publish\resources\world-downloader.jar"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Installer helper payload is missing: $path"
            }
          }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $exe = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $exe)) { $exe = "$env:ProgramFiles\NSIS\makensis.exe" }
          & $exe `
            "/DAPP_VERSION=${{ steps.ver.outputs.version }}" `
            "/DSRC_DIR=${{ github.workspace }}\publish" `
            "/DOUT_FILE=${{ github.workspace }}\WorldDownloaderManager-Setup.exe" `
            "installer\installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

      # ---- standalone release assets (jar + source zip alongside the installer) ----
      - name: Stage release assets
        shell: pwsh
        run: |
          Copy-Item "target\world-downloader.jar" "world-downloader.jar"
          git archive --format=zip -o "source.zip" HEAD
          $assets = @("WorldDownloaderManager-Setup.exe", "world-downloader.jar", "source.zip")
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          [IO.File]::WriteAllLines("SHA256SUMS.txt", $lines, [Text.UTF8Encoding]::new($false))

      - uses: actions/upload-artifact@v4
        with:
          name: all-in-one-${{ steps.ver.outputs.version }}
          path: |
            WorldDownloaderManager-Setup.exe
            world-downloader.jar
            source.zip
            SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: build-${{ github.run_number }}
          name: All-in-one build ${{ steps.ver.outputs.version }}
          overwrite_files: false
          fail_on_unmatched_files: true
          body: |
            Automated all-in-one build.
            - **WorldDownloaderManager-Setup.exe** — desktop manager installer (bundles the jar,
              docker-compose.yml, BlueMap helper, scraper helper and full source).
            - **world-downloader.jar** — the proxy/downloader jar (run with `java -jar`).
            - **source.zip** — full source snapshot.
            - **SHA256SUMS.txt** — SHA-256 checksums for every downloadable asset.
          files: |
            WorldDownloaderManager-Setup.exe
            world-downloader.jar
            source.zip
            SHA256SUMS.txt
