<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentation · World Downloader Studio</title>
<meta name="description" content="Redirects to the documentation reader at ../docs.html, keeping any deep link intact.">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/material.css">
<link rel="stylesheet" href="../assets/site.css">
<style>
  /* This page has exactly one job: forward to ../docs.html, keeping
     whatever query string or #hash the visitor arrived with (an
     article deep link, a teleport from the command palette, an
     inventory-row link from the landing page). Every other page's
     "Documentation" link points here on purpose, so those links stay
     stable at "docs/" while the real reader lives at "docs.html";
     nothing here is a second copy of the documentation. Every colour
     is a token, so this redirect still looks correct in whichever
     theme fires before the navigation completes.

     Deliberately exempt from the site's usual chrome and from
     assets/site.js: a visitor with scripting enabled never sees this
     page long enough for a tab strip, search bar, palette or
     notification host to be worth rendering -- the redirect above
     fires before first paint in practice -- and a visitor without
     scripting gets the noscript fallback link below, where none of
     that chrome could function anyway, since it is all JS-driven.
     Loading site.js here would only cost a script evaluation for a
     page that is never actually used. */
  body {
    background: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .redirect-card {
    max-width: 440px;
    display: flex; flex-direction: column; gap: 12px; align-items: flex-start;
  }
  .redirect-card a { color: var(--md-sys-color-primary); }
</style>
<script>
  /* A plain assignment (not replace) so a visitor who lands here
     directly still gets a normal, back-button-friendly navigation. */
  window.location.href = '../docs.html' + window.location.search + window.location.hash;
</script>
</head>
<body>
  <noscript>
    <div class="redirect-card">
      <p>The documentation reader moved to <a href="../docs.html">../docs.html</a>.</p>
      <p><a class="btn btn--filled" href="../docs.html">Open the documentation</a></p>
    </div>
  </noscript>
  <div class="redirect-card">
    <p>Taking you to the documentation reader…</p>
    <p><a href="../docs.html">Open it directly</a> if nothing happens.</p>
  </div>
</body>
</html>
