name: Release the desktop application

# The only workflow in this repository that publishes a GitHub Release, and the only thing it
# releases is the Electron desktop application in app/.
#
# There is deliberately NO test job, NO lint job, NO type-check job, NO coverage job and NO
# screenshot gate here, and nothing in any `needs:` chain that could withhold a release on a
# code-quality verdict. This workflow builds, packages and publishes. That is the whole job.
#
# This is the repository owner's explicit standing decision, and it has a cost worth stating
# plainly rather than pretending it is free: with no gate in the pipeline, a release can ship from
# a commit whose tests would have failed, and the first thing that notices will be a person running
# the installer. That is the accepted trade — artifacts reach people quickly and unconditionally.
# Checking happens locally, before the push, in the task that changes the code. A failing local
# test is still a defect to fix in that same task; it simply never blocks a build or a release.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

# Deliberately WITHOUT cancel-in-progress. This workflow has non-idempotent side effects: it
# creates a tag and a release and uploads assets. Cancelling a run halfway can strand a tag with no
# artifact behind it, which is far worse than letting two publishes queue up behind each other.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}

env:
  # Resolution chain: an optional repository-scoped fine-grained token first, then the organization
  # token, then the workflow token as a last fallback. Passed only through the GH_TOKEN convention
  # and never echoed, logged or written to a file.
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
  DIM_SUM_REPOSITORY: Ding-Ding-Projects/dim-sum-photos
  DIM_SUM_CATALOG_URL: https://raw.githubusercontent.com/Ding-Ding-Projects/dim-sum-photos/main/catalog/index.json

jobs:
  release:
    name: Build, package and publish
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history: the line counter attributes surviving lines with `git blame`, which needs
          # the commits those lines came from.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ------------------------------------------------------------------------------------------
      # Timing: measured from the workflow's own first-job start, read back from the API rather than
      # from a clock started inside this job, so the recorded figure covers queueing too. Never
      # estimated: if the API cannot answer, the notes say the value is unavailable.
      # ------------------------------------------------------------------------------------------
      - name: Record when the workflow started
        id: started
        run: |
          set -euo pipefail
          if started=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at 2>/dev/null) \
            && [ -n "${started}" ] && [ "${started}" != "null" ]; then
            echo "Workflow started at ${started}"
          else
            started="unavailable"
            echo "::warning title=Start time unavailable::The run_started_at field could not be read from the API; the release notes will say so rather than estimate it."
          fi
          echo "value=${started}" >> "$GITHUB_OUTPUT"

      - name: Decide the release tag and version
        id: version
        run: |
          set -euo pipefail
          # Monotonic in the run number, so no tag is ever recycled or overwritten.
          version="1.0.${GITHUB_RUN_NUMBER}"
          tag="app-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} (application version ${version})"

      - name: Refuse to recycle an existing tag
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error title=Tag already released::${tag} already has a release. Tags are immutable here and are never recycled or overwritten."
            exit 1
          fi
          echo "${tag} is free"

      # ------------------------------------------------------------------------------------------
      # The Java engine. The desktop application is not a second product beside this jar — it is
      # the UI that spawns it as the actual world-download engine, so a release of the application
      # without the engine it runs would ship half a thing.
      #
      # -DskipTests is correct and required here, not an oversight. This whole pipeline runs NO
      # test, lint, type-check, coverage or screenshot gate anywhere, on purpose (see the header
      # comment at the top of this file): that is the repository owner's explicit standing
      # decision, and running the Java test suite in this one step would quietly reintroduce
      # exactly the gate that was deliberately removed everywhere else. A failing Java test is
      # still a defect to fix locally, in the task that changed the code; it simply never blocks
      # this build or this release.
      # ------------------------------------------------------------------------------------------
      - name: Build the Java engine (jar)
        run: mvn -B -ntp clean package -DskipTests

      - name: Confirm the jar Maven produced
        run: |
          set -euo pipefail
          jar="target/world-downloader.jar"
          if [ ! -f "${jar}" ]; then
            echo "::error title=No jar produced::mvn package exited 0 but ${jar} does not exist. pom.xml pins <finalName>world-downloader</finalName> on the shade plugin; if that changed, this check and app/electron-builder.yml's extraResources entry both need updating together."
            exit 1
          fi
          bytes=$(stat -c %s "${jar}")
          if [ "${bytes}" -lt 1048576 ]; then
            echo "::error title=Jar too small::${jar} is only ${bytes} bytes, which looks like a packaging stub rather than the shaded jar with its dependencies. Refusing to ship it as the download engine."
            exit 1
          fi
          echo "Built ${jar} (${bytes} bytes)."

      - name: Install dependencies
        working-directory: app
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            if ! npm ci; then
              echo "::warning title=Lockfile install failed::npm ci did not succeed; falling back to npm install so packaging can continue."
              rm -rf node_modules
              npm install
            fi
          else
            npm install
          fi

      - name: Stamp the application version
        working-directory: app
        run: |
          set -euo pipefail
          # The installer, the package metadata and the tag all carry the same number, so the
          # Squirrel update feed sees a monotonic version rather than a constant one.
          npm version --no-git-tag-version --allow-same-version '${{ steps.version.outputs.version }}'
          node -e 'process.stdout.write("package.json version is now " + require("./package.json").version + "\n")'

      - name: Install the scraper bot's own dependencies
        working-directory: scraper
        run: |
          set -euo pipefail
          # scraper/ is a standalone Node project one directory above app/ that
          # app/electron-builder.yml bundles into every installer (extraResources:
          # ../scraper -> scraper) so the Scraper bot tab works on a machine that
          # has never had Node.js installed. Nothing upstream of this step installs
          # its dependencies. Without this, "Run predist" below fails loudly and
          # correctly at check-scraper-bundle.mjs, naming exactly this gap, rather
          # than letting a non-functional bot ship silently -- see
          # app/scripts/check-scraper-bundle.mjs and
          # scripts/download-dependencies.ps1's Resolve-ScraperDependencies (the
          # PowerShell-only local equivalent of this step).
          if [ -f package-lock.json ]; then
            if ! npm ci; then
              echo "::warning title=Scraper lockfile install failed::npm ci did not succeed in scraper/; falling back to npm install so the bundle guard can still pass."
              rm -rf node_modules
              npm install
            fi
          else
            npm install
          fi

      # ------------------------------------------------------------------------------------------
      # THE BUG THIS STEP FIXES: this workflow used to run `npm run build` and
      # `electron-builder` directly, which never triggers an npm "pre<script>" hook at
      # all. app/package.json's `predist` (ensure-electron-binary.mjs, then
      # fetch-dependencies.mjs, then check-scraper-bundle.mjs) was correctly written
      # and correctly wired to `npm run dist` -- and never once ran in CI. Every
      # release shipped an installer whose electron-builder.yml *claimed* to bundle a
      # JRE, MinGit and the Scraper bot, but had fetched none of them: the exact same
      # "wired at one end, consumed at neither" shape as the world-downloader.jar
      # defect fixed earlier, one layer up, in the very release pipeline that fixed
      # it. Proof: app-v1.0.91 and app-v1.0.93's Setup.exe were 164,772,864 and
      # 164,862,464 bytes -- ~90 KB apart, when a bundled JRE + MinGit add roughly
      # 88 MB.
      #
      # The fix calls the actual named npm script rather than hand-copying its
      # contents into this workflow, specifically so this cannot silently drift out
      # of sync again: whatever `predist` is defined as in package.json is what runs
      # here, so a future fourth step added there is picked up with no workflow edit
      # required. `npm run dist` (the ordinary local packaging command, and what
      # scripts/windows-build.ps1 calls) would trigger this hook automatically too;
      # it is invoked explicitly here instead of switching to `npm run dist` so the
      # build and packaging phases stay separate CI steps with their own pass/fail
      # signal, and so the packaging-only env vars below (GH_TOKEN, CSC_*) stay
      # scoped to only the electron-builder invocation that actually needs them
      # cleared, not to the whole build+package command.
      # ------------------------------------------------------------------------------------------
      - name: Run predist (electron binary, bundled runtime deps, scraper bundle guard)
        working-directory: app
        run: npm run predist

      - name: Build the application
        working-directory: app
        run: npm run build

      - name: Package the Windows installer with Squirrel
        working-directory: app
        env:
          # Blanked deliberately for this step only. electron-builder will publish to GitHub by
          # itself when it finds a token and a publish configuration, and this workflow does the
          # publishing explicitly further down; leaving the token visible here risks two publishers
          # racing for the same tag. `--publish never` says the same thing a second way.
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          # Code signing is permanently out of scope for this project. No certificate, no key, no
          # timestamp credential, no signer. These say so to every layer that might go looking.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
        run: npx electron-builder --win squirrel --config electron-builder.yml --publish never

      # ------------------------------------------------------------------------------------------
      # The whole lesson, made into a check: a green `electron-builder` exit code proves a
      # `from` path was CONSIDERED, never that anything was actually copied. electron-builder's
      # own `copyFiles()` (app-builder-lib/out/fileMatcher.js) does `statOrNull(matcher.from)`
      # and, on a missing directory, logs `log.warn("file source doesn't exist")` and returns --
      # it does NOT throw and does NOT fail the build. That is the exact mechanism that let this
      # ship before: app/electron-builder.yml's `extraResources` entries for `runtime` and
      # `scraper` would silently no-op if their source directories were ever empty or missing
      # again, and packaging would still exit 0. This step opens the actual packaged app
      # electron-builder just wrote and proves the real files are inside it, by exact path, before
      # anything here is collected, checked for signatures, or published.
      # ------------------------------------------------------------------------------------------
      - name: Confirm the packaged bundle actually carries its dependencies
        run: |
          set -euo pipefail
          # electron-builder's `--win squirrel` target builds the plain unpacked app into
          # release/win-unpacked/ as an intermediate step before wrapping it into the Squirrel
          # package (proven out already: the "Collect the release artifacts" step below has to
          # explicitly exclude app/release/win-unpacked/<product>.exe, a 211 MB file, from its
          # artifact sweep). extraResources land directly under win-unpacked/resources/ -- NOT
          # inside app.asar, since they are extraResources rather than `files` -- so this is
          # exactly where the packaged output actually is.
          unpacked="app/release/win-unpacked"
          if [ ! -d "${unpacked}" ]; then
            echo "::error title=No unpacked app::${unpacked} does not exist. electron-builder --win squirrel should have produced it as an intermediate output before wrapping the Squirrel package; something upstream did not run as expected."
            exit 1
          fi

          # path|human label, one per extraResources entry electron-builder.yml declares, plus
          # the scraper's own dependency this step also verifies actually got copied (not just
          # that scrape.js exists, but that node_modules travelled with it).
          required=(
            "resources/engine/world-downloader.jar|the Java engine (extraResources: ../target/world-downloader.jar)"
            "resources/runtime/jre/bin/java.exe|the bundled JRE (extraResources: resources/runtime; fetch-dependencies.mjs)"
            "resources/runtime/git/cmd/git.exe|MinGit (extraResources: resources/runtime; fetch-dependencies.mjs)"
            "resources/scraper/scrape.js|the Scraper bot's entry point (extraResources: ../scraper)"
            "resources/scraper/node_modules/mineflayer/package.json|the Scraper bot's own node_modules (npm install in scraper/)"
          )

          missing=0
          for entry in "${required[@]}"; do
            path="${entry%%|*}"
            label="${entry#*|}"
            full="${unpacked}/${path}"
            if [ -f "${full}" ]; then
              bytes=$(stat -c %s "${full}")
              echo "present: ${full} (${label}, ${bytes} bytes)"
            else
              echo "::error title=Bundled dependency missing from packaged app::${full} does not exist -- ${label}. electron-builder's extraResources silently no-ops on a missing 'from' directory instead of failing the build; this is exactly that failure, caught here before anything is published."
              missing=$((missing + 1))
            fi
          done

          if [ "${missing}" -gt 0 ]; then
            noun=$([ "${missing}" -eq 1 ] && echo 'dependency' || echo 'dependencies')
            echo "::error title=Packaged app is missing ${missing} bundled ${noun}::Refusing to publish an installer that resolves bundled tools it does not actually carry."
            exit 1
          fi

          # The cheapest signal that the bundle actually landed, as a second independent proof
          # beside the file-existence checks above: the setup executable's own size. Two prior
          # unbundled releases (app-v1.0.91, app-v1.0.93) shipped Setup.exe at 164,772,864 and
          # 164,862,464 bytes -- about 90 KB apart -- when the bundled JRE (48,993,215 bytes
          # compressed) and MinGit (38,792,847 bytes compressed) together add roughly 88 MB.
          # 200 MiB is comfortably above every known unbundled build and comfortably below the
          # ~250 MB a genuinely bundled one should reach, so it tolerates normal nupkg
          # recompression variance without tolerating "nothing was actually bundled".
          setup_exe=$(find app/release/squirrel-windows -maxdepth 1 -type f -name '*Setup*.exe' ! -name '*ExecutionStub*' 2>/dev/null | head -n1)
          if [ -z "${setup_exe}" ]; then
            echo "::error title=No setup executable to size-check::No *Setup*.exe was found under app/release/squirrel-windows."
            exit 1
          fi
          setup_bytes=$(stat -c %s "${setup_exe}")
          min_bundled_bytes=$((200 * 1024 * 1024))
          if [ "${setup_bytes}" -lt "${min_bundled_bytes}" ]; then
            echo "::error title=Setup.exe looks unbundled::${setup_exe} is only ${setup_bytes} bytes (< ${min_bundled_bytes}, the 200 MiB floor). Unbundled prior releases were ~164.8 MB; a genuinely bundled installer should be roughly 88 MB larger. The file-existence checks above may have passed on stale or unrelated files -- refusing to publish an installer this small."
            exit 1
          fi
          echo "Setup executable size check passed: ${setup_exe} is ${setup_bytes} bytes (>= ${min_bundled_bytes} bytes, the 200 MiB floor)."

      - name: Collect the release artifacts
        id: collect
        run: |
          set -euo pipefail
          # Deliberately relative. On a Windows runner GITHUB_WORKSPACE is a backslash path
          # (D:\a\repo\repo), and `find` under Git Bash reads those backslashes as escapes; the step
          # already runs in the workspace root, so a relative path is both simpler and correct. The
          # PowerShell step below is the one place a native Windows path is right.
          staging="staging"
          rm -rf "${staging}"
          mkdir -p "${staging}"

          # electron-builder writes the Squirrel output into a `squirrel-windows` subdirectory of
          # the configured output directory, so a collector that only looks at the output root
          # reports a missing installer even though packaging succeeded.
          #
          # Search that subdirectory and NOT the whole tree. A `*.exe` sweep across app/release
          # also matches app/release/win-unpacked/<product>.exe — the raw unpacked application,
          # which on this project is 211 MB — plus its ExecutionStub and Squirrel's own bundled
          # Squirrel.exe. All three shipped as release assets on app-v1.0.64 before this was
          # narrowed. Nothing failed: the release just carried four files a person would never
          # download, next to the one they should, with no way to tell which was which.
          squirrel_dir="app/release/squirrel-windows"
          if [ ! -d "${squirrel_dir}" ]; then
            echo "::error title=No Squirrel output::${squirrel_dir} does not exist. Packaging did not produce a Squirrel target."
            exit 1
          fi

          # Named exactly, so a future artifact appearing in that directory is not swept in by
          # accident. Squirrel.exe is the updater stub Squirrel copies in for its own use; it is
          # not something a user installs.
          find "${squirrel_dir}" -maxdepth 1 -type f \
            \( -name '*Setup*.exe' -o -name 'RELEASES' -o -name '*.nupkg' \) \
            ! -name 'Squirrel.exe' ! -name '*ExecutionStub*' > collected.txt 2>/dev/null || true

          found=0
          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            cp -f "${file}" "${staging}/"
            found=$((found + 1))
          done < collected.txt

          echo "Collected ${found} packaging outputs into staging/"
          ls -la "${staging}"

          setup_count=$(find "${staging}" -maxdepth 1 -type f -name '*Setup*.exe' | wc -l | tr -d '[:space:]')
          releases_count=$(find "${staging}" -maxdepth 1 -type f -name 'RELEASES' | wc -l | tr -d '[:space:]')
          full_count=$(find "${staging}" -maxdepth 1 -type f -name '*-full.nupkg' | wc -l | tr -d '[:space:]')
          delta_count=$(find "${staging}" -maxdepth 1 -type f -name '*-delta.nupkg' | wc -l | tr -d '[:space:]')

          if [ "${setup_count}" -eq 0 ]; then
            echo "::error title=No installer::Squirrel packaging produced no setup executable. Refusing to publish a release with nothing to install."
            exit 1
          fi
          if [ "${releases_count}" -eq 0 ]; then
            echo "::error title=No RELEASES file::Squirrel packaging produced no RELEASES index. The update feed would be unusable."
            exit 1
          fi
          if [ "${full_count}" -eq 0 ]; then
            echo "::error title=No full package::Squirrel packaging produced no full .nupkg. The update feed would be unusable."
            exit 1
          fi

          # The Java engine the application spawns, added explicitly and by name — never by
          # widening the sweep above. This is the same jar the "Build the Java engine (jar)" step
          # already verified exists and is non-trivially sized; it is copied into staging again
          # here (not moved) rather than assumed, so a release that silently lost the engine fails
          # this assertion instead of shipping quietly incomplete.
          jar_source="target/world-downloader.jar"
          if [ ! -f "${jar_source}" ]; then
            echo "::error title=No engine jar::${jar_source} does not exist. The Java engine build step should have produced it before packaging ran."
            exit 1
          fi
          cp -f "${jar_source}" "${staging}/world-downloader.jar"
          jar_bytes=$(stat -c %s "${staging}/world-downloader.jar")
          if [ "${jar_bytes}" -lt 1048576 ]; then
            echo "::error title=Engine jar too small::staging/world-downloader.jar is only ${jar_bytes} bytes. Refusing to publish a release whose engine looks like a stub."
            exit 1
          fi
          echo "Collected the engine jar into staging/ (${jar_bytes} bytes)."

          echo "delta_count=${delta_count}" >> "$GITHUB_OUTPUT"
          echo "staging=${staging}" >> "$GITHUB_OUTPUT"

      - name: Confirm every executable is unsigned
        shell: pwsh
        run: |
          # Code signing is permanently prohibited here. This is not a formality: if a tool ever
          # discovers a certificate and signs an artifact, that is a release blocker, not a bonus.
          $signed = @()
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE\staging" -Filter *.exe -File | ForEach-Object {
            $status = (Get-AuthenticodeSignature -FilePath $_.FullName).Status
            Write-Host "$($_.Name): $status"
            if ($status -ne 'NotSigned') { $signed += "$($_.Name) reports $status" }
          }
          if ($signed.Count -gt 0) {
            Write-Host "::error title=Signed artifact::$($signed -join '; ')"
            throw "An artifact is signed. Code signing is permanently out of scope for this project."
          }
          Write-Host "All executables report NotSigned, as intended."

      # ------------------------------------------------------------------------------------------
      # Line count. CI does the counting, at exactly the commit being released, using the committed
      # script so anyone can reproduce the figure locally with the same one command.
      # ------------------------------------------------------------------------------------------
      - name: Count the lines of code
        run: |
          set -uo pipefail
          if [ -f scripts/count-lines.mjs ]; then
            if node scripts/count-lines.mjs --markdown > line-count.md 2> line-count.err; then
              echo 'Line counter finished.'
            else
              {
                echo '> The committed line counter exited non-zero for this commit, so no line-count table'
                echo '> is published with this release. Its output is reproduced below verbatim.'
                echo ''
                echo '```'
                cat line-count.err
                echo '```'
              } > line-count.md
              echo '::warning title=Line counter failed::scripts/count-lines.mjs exited non-zero; the release notes say so instead of carrying a table.'
            fi
          else
            {
              echo '> No line-count table is published with this release: the committed counter'
              echo '> `scripts/count-lines.mjs` was not present at this commit. The count is produced by'
              echo '> CI from that script and is never hand-written, so nothing is substituted for it here.'
            } > line-count.md
            echo '::warning title=No line counter::scripts/count-lines.mjs is missing at this commit.'
          fi
          cat line-count.md

      # ------------------------------------------------------------------------------------------
      # Release code name. Resolved from the public dim sum catalog, one dish per release, never
      # reused. This is decoration with a purpose and must never block or delay a release: every
      # failure path below ends with the release shipping and the notes saying what happened.
      # ------------------------------------------------------------------------------------------
      - name: Read which dishes previous releases already used
        continue-on-error: true
        run: |
          set -uo pipefail
          : > prior-release-bodies.txt
          if gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq '.[].body' > prior-release-bodies.txt 2>/dev/null; then
            echo "Read $(wc -c < prior-release-bodies.txt) bytes of prior release notes."
          else
            echo '::warning title=Prior releases unreadable::Could not read prior release notes; a code name may repeat.'
          fi

      - name: List the published catalog volumes
        continue-on-error: true
        run: |
          set -uo pipefail
          : > catalog-volumes.txt
          if gh api "repos/${DIM_SUM_REPOSITORY}/releases" --paginate \
            --jq '.[] | select(.draft == false) | select(.tag_name | startswith("catalog-v1")) | .tag_name' \
            > catalog-volumes.txt 2>/dev/null; then
            echo "Published catalog volumes:"
            cat catalog-volumes.txt
          else
            echo '::warning title=Catalog volumes unreadable::Could not list the published catalog volumes.'
          fi

      - name: Choose and download one dim sum photo
        continue-on-error: true
        env:
          STAGING_DIR: staging
        run: |
          set -uo pipefail
          cat > pick-dish.mjs <<'PICK_DISH'
          // Resolve one release code name from the public dim sum catalog.
          //
          // The rules this implements: only ever choose a dish whose photo is actually published as
          // a release asset in the public catalog repository; never reuse a dish this repository has
          // already used; download exactly one image; and never let any of it block the release.
          //
          // Asset lists are deliberately NOT paginated. There are thousands of them across the
          // catalog volumes, and paging through all of them to choose one name costs far more than
          // asking about the single candidate we actually want. Instead the next unused dish is
          // taken from the catalog in order and its filename is probed with a HEAD request against
          // each published volume until one answers.
          import { writeFile, mkdir } from 'node:fs/promises';
          import { readFileSync, existsSync } from 'node:fs';
          import path from 'node:path';

          const CATALOG_URL = process.env.DIM_SUM_CATALOG_URL;
          const REPOSITORY = process.env.DIM_SUM_REPOSITORY;
          const STAGING_DIR = process.env.STAGING_DIR || 'staging';
          const MAX_CANDIDATES = 60;
          const PNG_MAGIC = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);

          const unresolved = async (reason) => {
            await writeFile('dim-sum.json', JSON.stringify({ resolved: false, reason }, null, 2), 'utf8');
            console.log('No code name resolved: ' + reason);
            process.exit(0);
          };

          const get = (url, method) =>
            fetch(url, { method, redirect: 'follow', signal: AbortSignal.timeout(60000) });

          try {
            const volumes = existsSync('catalog-volumes.txt')
              ? readFileSync('catalog-volumes.txt', 'utf8').split('\n').map((s) => s.trim()).filter(Boolean)
              : [];
            if (volumes.length === 0) {
              await unresolved('no published catalog volumes could be listed');
            }

            const priorNotes = existsSync('prior-release-bodies.txt')
              ? readFileSync('prior-release-bodies.txt', 'utf8')
              : '';

            const catalogResponse = await get(CATALOG_URL, 'GET');
            if (!catalogResponse.ok) {
              await unresolved('the catalog index responded ' + catalogResponse.status);
            }
            const catalog = await catalogResponse.json();
            const dishes = Array.isArray(catalog.dishes) ? catalog.dishes : [];
            if (dishes.length === 0) {
              await unresolved('the catalog index carried no dish records');
            }
            console.log('Catalog holds ' + dishes.length + ' dish records across ' + volumes.length + ' published volumes.');

            let attempted = 0;
            for (const dish of dishes) {
              const imagePath = dish && dish.image && typeof dish.image.path === 'string' ? dish.image.path : '';
              const filename = imagePath ? path.posix.basename(imagePath) : '';
              const nameEn = dish && dish.name && typeof dish.name.en === 'string' ? dish.name.en : '';
              const nameZh = dish && dish.name && typeof dish.name.zhHant === 'string' ? dish.name.zhHant : '';
              if (!filename || !nameEn) continue;

              // Already used by an earlier release of this repository.
              if (priorNotes.includes(filename)) continue;
              if (dish.id && priorNotes.includes(String(dish.id))) continue;

              if (attempted >= MAX_CANDIDATES) {
                await unresolved('the first ' + MAX_CANDIDATES + ' unused catalog records had no published photo');
              }
              attempted += 1;

              for (const volume of volumes) {
                const url = 'https://github.com/' + REPOSITORY + '/releases/download/' + volume + '/' + encodeURIComponent(filename);
                let head;
                try {
                  head = await get(url, 'HEAD');
                } catch (error) {
                  console.log('HEAD ' + volume + '/' + filename + ' failed: ' + error.message);
                  continue;
                }
                if (!head.ok) continue;

                const download = await get(url, 'GET');
                if (!download.ok) continue;
                const bytes = Buffer.from(await download.arrayBuffer());
                if (bytes.length < 1024 || !bytes.subarray(0, 8).equals(PNG_MAGIC)) {
                  console.log('Rejected ' + filename + ': the downloaded bytes are not a PNG.');
                  continue;
                }

                await mkdir(STAGING_DIR, { recursive: true });
                await writeFile(path.join(STAGING_DIR, filename), bytes);
                const alt = dish.image && dish.image.alt && typeof dish.image.alt.en === 'string'
                  ? dish.image.alt.en
                  : 'Photograph of ' + nameEn;
                await writeFile(
                  'dim-sum.json',
                  JSON.stringify(
                    { resolved: true, id: dish.id || '', nameEn, nameZh, filename, volume, alt, bytes: bytes.length },
                    null,
                    2,
                  ),
                  'utf8',
                );
                console.log('Code name: ' + nameEn + (nameZh ? ' · ' + nameZh : '') + ' (' + filename + ' from ' + volume + ')');
                process.exit(0);
              }
            }

            await unresolved('every catalog record was either already used or had no published photo');
          } catch (error) {
            await unresolved('resolution failed: ' + error.message);
          }
          PICK_DISH
          node pick-dish.mjs || echo '::warning title=No code name::A dim sum code name could not be resolved; the release ships without one and says so.'
          if [ ! -f dim-sum.json ]; then
            printf '%s\n' '{ "resolved": false, "reason": "the resolver did not run to completion" }' > dim-sum.json
          fi
          cat dim-sum.json

      - name: Compose the release notes
        id: notes
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          tag='${{ steps.version.outputs.tag }}'
          started='${{ steps.started.outputs.value }}'
          completed=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ "${started}" = "unavailable" ]; then
            duration="unavailable"
          else
            duration=$(WF_STARTED="${started}" WF_COMPLETED="${completed}" node -e 'const a=new Date(process.env.WF_STARTED),b=new Date(process.env.WF_COMPLETED);if(Number.isNaN(a.getTime())||Number.isNaN(b.getTime())){process.stdout.write("unavailable");}else{let s=Math.max(0,Math.round((b-a)/1000));const p=(n)=>String(n).padStart(2,"0");process.stdout.write(p(Math.floor(s/3600))+":"+p(Math.floor((s%3600)/60))+":"+p(s%60));}')
          fi

          echo "completed=${completed}" >> "$GITHUB_OUTPUT"
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"

          notes=RELEASE_NOTES.md
          {
            echo "## World Downloader Studio ${version}"
            echo ''
            echo 'The Minecraft world downloader proxy, the world tools, the live map pipeline, the web console'
            echo 'and the automation bot, combined into one Material Design 3 desktop application, together with'
            echo 'the Java engine (`world-downloader.jar`) the application spawns to actually do the downloading.'
            echo 'The jar is not a second product: it is the engine this application drives, so this release'
            echo 'carries it alongside the installer rather than shipping an application with no engine.'
            echo ''
            echo '> [!WARNING]'
            echo '> **These artifacts are unsigned.** Code signing is permanently out of scope for this project:'
            echo '> no certificate, no signing key and no signer is used anywhere in the build. Windows will show'
            echo "> an unknown-publisher or SmartScreen warning when you run the installer, and that is expected."
            echo '> No authenticity or signature verification is claimed for any file attached here. Verify the'
            echo '> download against the SHA-256 digests in the artifact table below if you want an integrity check.'
            echo ''
            echo '### Install'
            echo ''
            echo '1. Download the `Setup.exe` asset below.'
            echo '2. Run it. Squirrel installs per user, so no administrator rights are needed.'
            echo '3. Dismiss the unknown-publisher warning described above.'
            echo ''
            echo 'The application checks this feed for updates on startup and on a bounded background schedule,'
            echo 'stages an update in the background, and shows a non-blocking banner offering to restart. It'
            echo 'never restarts on its own.'
            echo ''
            echo '### The engine (`world-downloader.jar`)'
            echo ''
            echo 'This is **not** a second application to install. It is the Java process the desktop application'
            echo 'spawns to speak the Minecraft protocol and write the world to disk; the desktop application is'
            echo 'the UI on top of it. It requires a Java 21+ runtime on your machine (the application checks for'
            echo 'one and links to https://adoptium.net/temurin/releases/ if none is found).'
            echo ''
            echo 'You do not need to download `world-downloader.jar` yourself for a normal install: the Windows'
            echo 'installer bundles it inside the packaged application as the default engine, and the'
            echo "application's own \"Jar path\" setting only needs to point somewhere else if you want to run a"
            echo 'different build of the jar than the one bundled with this release. It is attached to this'
            echo 'release separately so it can be run standalone (`java -jar world-downloader.jar --help`) or'
            echo 'inspected without installing the desktop application at all.'
            echo ''
            echo '### Checks that were run'
            echo ''
            echo 'None. This pipeline is deliberately ungated: the release workflow builds, packages and'
            echo 'publishes, and runs no test, lint, type-check, coverage, accessibility or screenshot gate.'
            echo 'Nothing in it can withhold a release on a code-quality verdict. Checking happens locally,'
            echo 'before the push, in the task that changes the code — so this release is **not** described as'
            echo 'passing anything, because nothing here checked it.'
            echo ''
            echo '### Build'
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            printf '| Tag | `%s` |\n' "${tag}"
            printf '| Version | `%s` |\n' "${version}"
            printf '| Commit | `%s` |\n' "${GITHUB_SHA}"
            printf '| Workflow run | [%s](%s/%s/actions/runs/%s) |\n' "${GITHUB_RUN_ID}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf '| Installer | Squirrel.Windows, x64, unsigned |\n'
            printf '| Workflow started | `%s` |\n' "${started}"
            printf '| Workflow completed | `%s` |\n' "${completed}"
            printf '| Workflow duration | `%s` |\n' "${duration}"
            echo ''
            echo '### Artifacts'
            echo ''
            echo '| File | Size | SHA-256 |'
            echo '| --- | ---: | --- |'
          } > "${notes}"

          for file in staging/*; do
            [ -f "${file}" ] || continue
            name=$(basename "${file}")
            bytes=$(stat -c %s "${file}")
            mib=$(awk -v b="${bytes}" 'BEGIN { printf "%.2f", b / 1048576 }')
            sha=$(sha256sum "${file}" | cut -d' ' -f1)
            printf '| `%s` | %s MiB | `%s` |\n' "${name}" "${mib}" "${sha}" >> "${notes}"
          done

          {
            echo ''
            echo '### Lines of code'
            echo ''
            echo 'Counted by CI at the released commit with the repository'"'"'s own committed script, so the'
            echo 'figure is reproducible locally with `node scripts/count-lines.mjs --markdown`.'
            echo ''
            cat line-count.md
            echo ''
            echo '### Release code name'
            echo ''
          } >> "${notes}"

          node -e '
            const fs = require("node:fs");
            const notes = process.argv[1];
            let dish = { resolved: false, reason: "no resolver output" };
            try { dish = JSON.parse(fs.readFileSync("dim-sum.json", "utf8")); } catch (error) { dish.reason = error.message; }
            const lines = [];
            if (dish.resolved) {
              lines.push("**" + dish.nameEn + " · " + dish.nameZh + "**");
              lines.push("");
              lines.push("A label beside the version, never a replacement for it: this release is identified by");
              lines.push("`" + process.env.RELEASE_TAG + "`. Each code name is used once and never repeated.");
              lines.push("");
              lines.push("| Field | Value |");
              lines.push("| --- | --- |");
              lines.push("| Dish (English) | " + dish.nameEn + " |");
              lines.push("| Dish (Traditional Chinese) | " + dish.nameZh + " |");
              lines.push("| Catalog record | `" + dish.id + "` |");
              lines.push("| Photo asset attached here | `" + dish.filename + "` |");
              lines.push("| Public catalog volume | `" + dish.volume + "` |");
              lines.push("| Alt text | " + dish.alt + " |");
              lines.push("");
              lines.push("The photo is from the public dim sum catalog at");
              lines.push("https://github.com/Ding-Ding-Projects/dim-sum-photos and is attached to this release as");
              lines.push("`" + dish.filename + "`.");
            } else {
              lines.push("No code name was resolved for this release: " + dish.reason + ".");
              lines.push("");
              lines.push("The code name is decoration with a purpose and never blocks a release, so this build");
              lines.push("ships identified by its version alone.");
            }
            fs.appendFileSync(notes, lines.join("\n") + "\n");
          ' "${notes}"

          echo '--- release notes ---'
          cat "${notes}"
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}

      - name: Publish the release
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          version='${{ steps.version.outputs.version }}'
          shopt -s nullglob
          assets=(staging/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo '::error title=Nothing to attach::No assets were staged; refusing to publish an empty release.'
            exit 1
          fi
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "World Downloader Studio ${version}" \
            --notes-file RELEASE_NOTES.md \
            "${assets[@]}"

      - name: Verify the published release
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft,tagName,targetCommitish,assets > published.json
          node -e '
            const release = JSON.parse(require("node:fs").readFileSync("published.json", "utf8"));
            const problems = [];
            if (release.isDraft) problems.push("the release is a draft");
            const names = (release.assets || []).map((asset) => asset.name);
            if (!names.some((name) => name.toLowerCase().endsWith(".exe"))) problems.push("no installer is attached");
            if (!names.includes("RELEASES")) problems.push("no RELEASES index is attached");
            if (!names.some((name) => name.toLowerCase().endsWith("-full.nupkg"))) problems.push("no full package is attached");
            if (!names.includes("world-downloader.jar")) problems.push("no engine jar is attached");
            console.log("Published " + release.tagName + " with " + names.length + " assets:");
            for (const name of names) console.log("  " + name);
            if (problems.length > 0) {
              console.error("::error title=Release incomplete::" + problems.join("; "));
              process.exit(1);
            }
          '

      - name: Summarize the run
        if: ${{ always() }}
        run: |
          set -uo pipefail
          {
            echo '### Release'
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            printf '| Tag | `%s` |\n' '${{ steps.version.outputs.tag }}'
            printf '| Commit | `%s` |\n' "${GITHUB_SHA}"
            printf '| Started | `%s` |\n' '${{ steps.started.outputs.value }}'
            printf '| Completed | `%s` |\n' '${{ steps.notes.outputs.completed }}'
            printf '| Duration | `%s` |\n' '${{ steps.notes.outputs.duration }}'
            printf '| Signing | none, permanently out of scope |\n'
            printf '| Gates | none, this pipeline is ungated by design |\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # Evidence survives a failed run: collect whatever safe output exists even when an earlier
      # step failed, and never let artifact handling mask the original failure or turn it green.
      # Only packaging outputs and the generated notes are uploaded — never credentials, never
      # node_modules, never a cache, never the source tree.
      - name: Upload the packaging outputs as run evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-squirrel-${{ github.run_number }}
          path: |
            staging/**
            RELEASE_NOTES.md
            line-count.md
            dim-sum.json
          if-no-files-found: warn
          retention-days: 14
