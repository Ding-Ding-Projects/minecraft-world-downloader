  /* ================================================================

  function block(titleText, children) {
    var node = el('div', { class: 'stack', style: { gap: '14px' } }, [el('h2', { text: titleText })]);
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }
  function card(children) { return el('div', { class: 'mdl-card' }, children); }
  function chip(text, cls) { return el('span', { class: 'chip' + (cls ? ' ' + cls : ''), text: text }); }
  function progressBar(fraction, indeterminate) {
    var bar = el('div', { class: 'prog' + (indeterminate ? ' prog--indeterminate' : ''), role: 'progressbar',
      'aria-valuemin': '0', 'aria-valuemax': '100',

    bar.appendChild(fill);

  /* ================================================================
   * 5. Overview / connection
   * ================================================================ */
  var lastProbe = { state: 'unknown', detail: '', version: null };
  var overviewRefs = {};

  function renderOverview(panel) {
    clear(panel);
    panel.appendChild(el('h2', { 'data-i18n': 'models.tab.overview' }));
    panel.appendChild(el('p', { class: 'lede', 'data-i18n': 'models.lede' }));

    var scopeCard = card([
      el('h3', { 'data-i18n': 'models.scope.title' }),
      el('p', { class: 'muted', 'data-i18n': 'models.scope.note' })
    ]);
    panel.appendChild(scopeCard);

    var urlInput = el('input', { class: 'mdl-native', type: 'text', id: 'models-base-url', value: M.getBaseUrl(),
      'aria-label': t('models.baseUrl.label', 'Runtime address'), autocomplete: 'off', spellcheck: 'false' });
    var statusDot = el('span', { class: 'mdl-dot' });
    var statusText = el('span', { text: t('models.state.unknown', 'Not checked yet.') });
    var probeBtn = el('button', { class: 'btn btn--filled', type: 'button', text: t('models.probe', 'Check connection') });
    var connCard = card([
      el('div', { class: 'mdl-fields' }, [
        el('label', { class: 'field field--outlined' }, [
          el('span', { class: 'field__label', text: t('models.baseUrl.label', 'Runtime address') }),
          urlInput
        ])
      ]),
      el('p', { class: 'muted t-body-small', text: t('models.baseUrl.explain', '') }),
      el('div', { class: 'mdl-row' }, [probeBtn, el('span', { class: 'row', style: { gap: '8px', 'align-items': 'center' } }, [statusDot, statusText])])
    ]);
    panel.appendChild(connCard);
    overviewRefs = { statusDot: statusDot, statusText: statusText };

    function applyProbeResult(result) {
      lastProbe = result;
      statusDot.className = 'mdl-dot' +
        (result.state === 'reachable' ? ' mdl-dot--ok' : (result.state === 'cors-blocked' ? ' mdl-dot--warn' : (result.state === 'unreachable' || result.state === 'unsupported' ? ' mdl-dot--err' : '')));
      var key = result.state === 'reachable' ? 'models.state.reachable'
        : result.state === 'cors-blocked' ? 'models.state.corsBlocked'
        : result.state === 'unreachable' ? 'models.state.unreachable'
        : result.state === 'unsupported' ? 'models.state.unsupported'
        : 'models.state.unknown';
      statusText.textContent = t(key, result.state);
      var detailNode = document.getElementById('models-probe-detail');
      if (detailNode) detailNode.textContent = result.detail || (result.version ? ('Runtime version ' + result.version + '.') : '');
    }

    connCard.appendChild(el('p', { class: 'muted t-body-small', id: 'models-probe-detail' }));

    urlInput.addEventListener('change', function () {
      M.setBaseUrl(urlInput.value);
      urlInput.value = M.getBaseUrl();
      S.history.record('models', 'Runtime address changed', { baseUrl: M.getBaseUrl() });
    });
    probeBtn.addEventListener('click', function () {
      probeBtn.disabled = true;
      statusText.textContent = t('models.probe.checking', 'Checking…');
      statusDot.className = 'mdl-dot';
      M.probe(M.getBaseUrl()).then(function (result) {
        probeBtn.disabled = false;
        applyProbeResult(result);
        if (result.state === 'reachable') S.notify.success(t('models.state.reachable', 'Connected.'));
        else S.notify.warn(statusTextFor(result));
      });
    });
    function statusTextFor(result) {
      var key = result.state === 'cors-blocked' ? 'models.state.corsBlocked'
        : result.state === 'unreachable' ? 'models.state.unreachable'
        : 'models.state.unsupported';
      return t(key, result.state) + (result.detail ? (' ' + result.detail) : '');
    }

    var boundsCard = card([
      el('h3', { text: 'Boundaries, stated plainly' }),
      el('ul', { class: 'stack', style: { gap: '6px', 'padding-left': '18px', margin: '0' } }, [
        el('li', { text: 'A browser cannot tell "nothing is listening" apart from "something is listening but refused this page\'s origin" without asking twice. This page asks twice, and reports which one actually happened.' }),
        el('li', { text: 'Loopback addresses (127.0.0.1 and localhost) are treated as secure by every current browser, so reaching them from this page (served over https) is not blocked as mixed content the way a real remote http address would be.' }),
        el('li', { text: 'If the runtime is reachable but refuses this page\'s origin, its CORS allow-list needs this page\'s exact origin added and the runtime restarted -- this page cannot change that setting for you.' })
      ])
    ]);
    panel.appendChild(boundsCard);

    S.i18n.apply(panel);
    applyProbeResult(lastProbe);
  }

  /* ================================================================
   * 6. Catalog
   * ================================================================ */
  var catalogFilterState = { family: 'all', quant: 'all', runningOnly: false, sort: 'name', group: false };
  var catalogSearch = null;
  var COMMON_FAMILIES = [
    { name: 'llama3.2', example: 'llama3.2:3b' },
    { name: 'llama3.1', example: 'llama3.1:8b' },
    { name: 'qwen2.5', example: 'qwen2.5:7b' },
    { name: 'mistral', example: 'mistral:7b' },
    { name: 'gemma2', example: 'gemma2:9b' },
    { name: 'phi3', example: 'phi3:mini' },
    { name: 'codellama', example: 'codellama:7b' },
    { name: 'deepseek-coder-v2', example: 'deepseek-coder-v2:16b' }
  ];

  function renderCatalog(panel) {
    clear(panel);
    panel.appendChild(el('h2', { 'data-i18n': 'models.tab.catalog' }));
    panel.appendChild(el('div', { class: 'note note--warn' }, [
      el('strong', { text: t('models.scope.title', 'What this page can see') + ': ' }),
      el('span', { 'data-i18n': 'models.scope.note' })
    ]));

    var refreshBtn = el('button', { class: 'btn btn--filled', type: 'button', text: t('models.catalog.refresh', 'Refresh catalog') });
    var statusLine = el('p', { class: 'muted t-body-small', role: 'status', 'aria-live': 'polite' });
    panel.appendChild(el('div', { class: 'mdl-row' }, [refreshBtn, statusLine]));

    catalogSearch = S.createSearchBar({
      ariaLabel: 'Search the installed model catalog', placeholder: 'Search name, family, quantization',
      storageKey: 'models-catalog', help: 'Searches the model name, its family and its quantization level.',
      sampleProvider: function () { return catalogEntries().map(function (e) { return e.name + ' ' + (e.family || '') + ' ' + (e.quantization || ''); }).join('\n'); },
      onChange: function () { paintCatalogList(); }
    });
    panel.appendChild(catalogSearch.el);

    var familySelect = S.createSelect({ ariaLabel: 'Filter by family', storageKey: 'models-catalog-family', value: 'all', options: [{ value: 'all', label: 'Every family' }], onChange: function (v) { catalogFilterState.family = v; paintCatalogList(); } });
    var quantSelect = S.createSelect({ ariaLabel: 'Filter by quantization', storageKey: 'models-catalog-quant', value: 'all', options: [{ value: 'all', label: 'Every quantization' }], onChange: function (v) { catalogFilterState.quant = v; paintCatalogList(); } });
    var sortSelect = S.createSelect({
      ariaLabel: 'Sort by', storageKey: 'models-catalog-sort', value: 'name',
      options: [
        { value: 'name', label: 'Name' }, { value: 'size-desc', label: 'Size, largest first' },
        { value: 'size-asc', label: 'Size, smallest first' }, { value: 'modified', label: 'Most recently modified' }
      ],
      onChange: function (v) { catalogFilterState.sort = v; paintCatalogList(); }
    });
    var runningSwitch = S.makeSwitch({ checked: false, ariaLabel: 'Running models only', onChange: function (v) { catalogFilterState.runningOnly = v; paintCatalogList(); } });
    var groupSwitch = S.makeSwitch({ checked: false, ariaLabel: 'Group by family', onChange: function (v) { catalogFilterState.group = v; paintCatalogList(); } });

    var filterHost = el('div', { class: 'mdl-fields' }, [
      el('label', { class: 'stack', style: { gap: '4px' } }, [el('span', { class: 't-label-small', text: 'Family' }), familySelect.el]),
      el('label', { class: 'stack', style: { gap: '4px' } }, [el('span', { class: 't-label-small', text: 'Quantization' }), quantSelect.el]),
      el('label', { class: 'stack', style: { gap: '4px' } }, [el('span', { class: 't-label-small', text: 'Sort by' }), sortSelect.el]),
      el('div', { class: 'row', style: { gap: '10px', 'align-items': 'center' } }, [runningSwitch, el('span', { text: 'Running only' })]),
      el('div', { class: 'row', style: { gap: '10px', 'align-items': 'center' } }, [groupSwitch, el('span', { text: 'Group by family' })])
    ]);
    var filterWrap = el('div'); filterWrap.appendChild(filterHost);
    panel.appendChild(filterWrap);
    var filterBox = S.collapse.attach(filterWrap, { title: 'Filters and sorting', descriptive: true, storageKey: 'models-catalog-filters' });

    var listNode = el('ul', { class: 'mdl-list', role: 'listbox', 'aria-label': 'Installed models', 'aria-multiselectable': 'true' });
    panel.appendChild(listNode);

    var bulkCtl = S.bulk.attach(listNode, {
      itemSelector: '[data-bulk-item]',
      getLabel: function (id) { var e = findEntry(id); return e ? e.name : id; },
      allMatchingCount: function () { return catalogRows().length; },
      allMatchingIds: function () { return catalogRows().map(function (e) { return e.name; }); },
      actions: [
        { id: 'export', label: t('act.export', 'Export'), run: function (ids) {
          var rows = catalogRows().filter(function (e) { return ids.indexOf(e.name) >= 0; });
          S.exportDialog(rows, { name: 'installed-models', anchor: listNode, omitted: 'Nothing is left out: every field this runtime reported is present.' });
          return { done: rows.length, skipped: 0 };
        } },
        { id: 'copy-name', label: 'Copy names', run: function (ids) {
          return S.copy(ids.join('\n')).then(function () { return { done: ids.length, skipped: 0 }; });
        } },
        { id: 'delete', label: t('act.remove', 'Delete'), danger: true, destructive: true, run: function (ids) {
          if (lastCatalogState !== 'reachable') return { done: 0, skipped: ids.length, reason: 'Not connected to the runtime right now, so nothing could actually be deleted.' };
          var results = ids.map(function (name) {
            return M.deleteModel(name).then(function () { return { name: name, ok: true }; }, function (err) { return { name: name, ok: false, error: err && err.message }; });
          });
          return Promise.all(results).then(function (outcomes) {
            var done = outcomes.filter(function (o) { return o.ok; }).length;
            var failed = outcomes.filter(function (o) { return !o.ok; });
            return doRefresh().then(function () {
              return { done: done, skipped: failed.length, reason: failed.length ? ('Failed: ' + failed.map(function (f) { return f.name + ' (' + f.error + ')'; }).join('; ')) : undefined };
            });
          });
        } }
      ]
    });

    function findEntry(name) { return catalogRows().filter(function (e) { return e.name === name; })[0] || null; }

    function catalogRows() {
      var snap = M.lastSnapshot();
      return (snap && snap.entries) || [];
    }
    function catalogEntries() { return catalogRows(); }

    function refreshFilterOptions() {
      var families = {}, quants = {};
      catalogRows().forEach(function (e) { if (e.family) families[e.family] = true; if (e.quantization) quants[e.quantization] = true; });
      familySelect.setOptions([{ value: 'all', label: 'Every family' }].concat(Object.keys(families).sort().map(function (f) { return { value: f, label: f }; })));
      quantSelect.setOptions([{ value: 'all', label: 'Every quantization' }].concat(Object.keys(quants).sort().map(function (q) { return { value: q, label: q }; })));
    }

    function filteredSortedRows() {
      var rows = catalogRows().slice();
      if (catalogSearch && catalogSearch.value()) {
        var m = catalogSearch.matcher();
        rows = rows.filter(function (e) { return m(e.name + ' ' + (e.family || '') + ' ' + (e.quantization || '')); });
      }
      if (catalogFilterState.family !== 'all') rows = rows.filter(function (e) { return e.family === catalogFilterState.family; });
      if (catalogFilterState.quant !== 'all') rows = rows.filter(function (e) { return e.quantization === catalogFilterState.quant; });
      if (catalogFilterState.runningOnly) rows = rows.filter(function (e) { return e.running; });
      rows.sort(function (a, b) {
        if (catalogFilterState.sort === 'size-desc') return (b.sizeBytes || 0) - (a.sizeBytes || 0);
        if (catalogFilterState.sort === 'size-asc') return (a.sizeBytes || 0) - (b.sizeBytes || 0);
        if (catalogFilterState.sort === 'modified') return String(b.modifiedAt || '').localeCompare(String(a.modifiedAt || ''));
        return a.name.localeCompare(b.name);
      });
      return rows;
    }

    function fitBadge(entry) {
      var v = M.hardwareVerdict(entry);
      var cls = v.verdict === 'Runs well' ? 'status--ok' : v.verdict === 'Unlikely' ? 'status--error' : v.verdict === 'Runs with limits' ? 'status--warn' : '';
      var badge = el('button', { class: 'status ' + cls, type: 'button', title: 'Why: ' + v.reasons.join(' '), text: v.verdict });
      badge.addEventListener('click', function () {
        S.overlay.open({
          anchor: badge, title: t('models.fit.title', 'Hardware fit') + ': ' + entry.name,
          content: [
            el('p', { class: 'muted', 'data-i18n': 'models.fit.disclaimer' }),
            el('p', { text: 'Verdict: ' + v.verdict }),
            el('ul', { style: { 'padding-left': '18px', margin: '8px 0 0' } }, v.reasons.map(function (r) { return el('li', { text: r }); }))
          ]
        });
      });
      return badge;
    }

    function paintCatalogList() {
      refreshFilterOptions();
      clear(listNode);
      var rows = filteredSortedRows();
      var groups = catalogFilterState.group
        ? rows.reduce(function (acc, e) { var k = e.family || 'Other'; (acc[k] = acc[k] || []).push(e); return acc; }, {})
        : { '': rows };
      var groupKeys = Object.keys(groups).sort();
      if (!rows.length) {
        var emptyMsg = catalogRows().length ? t('msg.noMatch', 'No matches.') : t('models.catalog.empty', '');
        listNode.appendChild(el('li', { class: 'note', text: emptyMsg }));
      } else {
        groupKeys.forEach(function (gk) {
          if (catalogFilterState.group && gk) listNode.appendChild(el('li', { class: 't-label-large muted', style: { padding: '4px 0' }, text: gk, role: 'presentation' }));
          groups[gk].forEach(function (e) {
            var checkbox = el('span', { class: 'cbx', 'data-bulk-check': '', role: 'checkbox', 'aria-checked': 'false', 'aria-label': 'Select ' + e.name });
            var item = el('li', { class: 'mdl-item', 'data-bulk-item': '', 'data-id': e.name, tabindex: '0', role: 'option', 'aria-selected': 'false' }, [
              el('div', { class: 'mdl-item__top' }, [
                checkbox,
                el('span', { class: 'mdl-item__name', text: e.name }),
                e.running ? chip('Running', 'status--ok') : null,
                fitBadge(e)
              ]),
              el('div', { class: 'mdl-item__meta' }, [
                e.family ? el('span', { text: 'Family: ' + e.family }) : null,
                e.parameterSize ? el('span', { text: 'Parameters: ' + e.parameterSize }) : null,
                e.quantization ? el('span', { text: 'Quantization: ' + e.quantization }) : null,
                el('span', { text: 'Size: ' + M.fmtBytes(e.sizeBytes) }),
                e.modifiedAt ? el('span', { text: 'Modified: ' + new Date(e.modifiedAt).toLocaleString() }) : null
              ]),
              el('div', { class: 'mdl-item__actions' }, [
                el('button', { class: 'btn btn--text', type: 'button', text: 'Details', onclick: function (ev) { openDetails(e, ev.currentTarget); } }),
                el('button', { class: 'btn btn--text', type: 'button', text: 'Queue re-pull', onclick: function () { enqueueName(e.name); } }),
                el('button', { class: 'btn btn--text', type: 'button', text: 'Copy as…', onclick: function (ev) { openCopyPrompt(e.name, ev.currentTarget); } })
              ])
            ]);
            listNode.appendChild(item);
          });
        });
      }
      S.i18n.apply(listNode);
      if (bulkCtl && bulkCtl.refresh) bulkCtl.refresh();
    }

    function openDetails(entry, anchor) {
      var body = [el('p', { class: 'muted', text: 'Loading details from /api/show…' })];
      var panelOverlay = S.overlay.open({ anchor: anchor, title: entry.name, content: body });
      M.showModel(entry.name).then(function (resp) {
        var caps = M.modelCapabilities(resp);
        clear(panelOverlay.body);
        S.append(panelOverlay.body, [
          el('p', { text: 'Digest: ' + (entry.digest || 'unknown') }),
          el('p', { text: 'Size on disk: ' + M.fmtBytes(entry.sizeBytes) }),
          el('p', { text: 'Capabilities: ' + caps.note }),
          resp && resp.parameters ? el('div', { class: 'scrollx' }, el('pre', {}, el('code', { text: String(resp.parameters) }))) : null
        ]);
      }, function (err) {
        clear(panelOverlay.body);
        panelOverlay.body.appendChild(el('p', { class: 'note--warn', text: 'Could not load details: ' + ((err && err.message) || String(err)) }));
      });
    }

    function openCopyPrompt(sourceName, anchor) {
      var input = el('input', { class: 'mdl-native', type: 'text', value: sourceName + '-copy', 'aria-label': 'New name for the copy' });
      var goBtn = el('button', { class: 'btn btn--filled', type: 'button', text: 'Copy' });
      var p = S.overlay.open({ anchor: anchor, title: 'Copy ' + sourceName, content: [
        el('div', { class: 'field field--outlined' }, [el('span', { class: 'field__label', text: 'New name' }), input]),
        goBtn
      ] });
      goBtn.addEventListener('click', function () {
        var v = M.validateModelName(input.value);
        if (!v.ok) { S.notify.error('That name is not valid: ' + v.reason + '.'); return; }
        M.copyModel(sourceName, v.value).then(function () {
          S.notify.success('Copied to ' + v.value + '.');
          p.close('done');
          doRefresh();
        }, function (err) { S.notify.error('Copy failed: ' + ((err && err.message) || String(err))); });
      });
    }

    /* -- guided "add a new pull" form -------------------------------- */
    var nameInput = el('input', { class: 'mdl-native', type: 'text', placeholder: 'family:tag', list: 'models-name-suggestions',
      'aria-label': t('models.pull.name.label', 'Model name to pull'), autocomplete: 'off', spellcheck: 'false' });
    var suggestionList = el('datalist', { id: 'models-name-suggestions' });
    var addBtn = el('button', { class: 'btn btn--filled', type: 'button', text: t('models.pull.add', 'Add to pull queue') });
    var nameValidity = el('p', { class: 'muted t-body-small', 'aria-live': 'polite' });

    function refreshSuggestions() {
      clear(suggestionList);
      catalogRows().forEach(function (e) { suggestionList.appendChild(el('option', { value: e.name })); });
      COMMON_FAMILIES.forEach(function (f) { suggestionList.appendChild(el('option', { value: f.example })); });
    }
    function enqueueName(name) {
      var result = M.enqueuePull(name);
      if (!result.ok) { S.notify.error('"' + name + '" is not a valid model name (' + result.reason + ').'); return; }
      S.notify.success('Queued ' + name + '.');
      S.history.record('models', 'Queued a pull: ' + name, { name: name });
      strip.select('pull');
    }
    nameInput.addEventListener('input', function () {
      var v = M.validateModelName(nameInput.value);
      nameValidity.textContent = nameInput.value.trim() === '' ? '' : (v.ok ? 'Looks like a valid name.' : ('Not a valid name yet (' + v.reason + ').'));
    });
    addBtn.addEventListener('click', function () { enqueueName(nameInput.value); nameInput.value = ''; nameValidity.textContent = ''; });

    var addCard = card([
      el('h3', { text: t('models.pull.add', 'Add to pull queue') }),
      el('p', { class: 'muted t-body-small', 'data-i18n': 'models.pull.name.help' }),
      el('div', { class: 'note note--warn' }, [
        el('strong', { text: 'Not verified: ' }),
        el('span', { text: 'the suggestions below are either models already installed on this runtime (real), or a small bundled list of common family names (' +
          COMMON_FAMILIES.map(function (f) { return f.name; }).join(', ') + ') that ships with this page and is not checked against anything live. Typing a name that does not exist will simply fail when queued -- this page has no way to confirm one exists before trying.' })
      ]),
      el('div', { class: 'mdl-row' }, [
        el('div', { class: 'field field--outlined', style: { flex: '1', 'min-width': '220px' } }, [
          el('span', { class: 'field__label', text: t('models.pull.name.label', 'Model name to pull') }), nameInput
        ]),
        addBtn
      ]),
      nameValidity,
      suggestionList
    ]);
    panel.appendChild(addCard);

    var lastCatalogState = 'unknown';
    function doRefresh() {
      refreshBtn.disabled = true;
      statusLine.textContent = t('models.probe.checking', 'Checking…');
      return M.refreshCatalog().then(function (snap) {
        refreshBtn.disabled = false;
        lastCatalogState = snap.state;
        refreshSuggestions();
        paintCatalogList();
        if (snap.ok) {
          statusLine.textContent = t('models.catalog.stale', 'Last refreshed') + ': ' + new Date(snap.refreshedAt).toLocaleTimeString() +
            ' · ' + snap.entries.length + ' installed · pages read: ' + snap.pageCount + ' · ' + snap.completenessNote;
          S.notify.success('Catalog refreshed: ' + snap.entries.length + ' installed model(s).');
        } else {
          var prior = M.lastSnapshot();
          statusLine.textContent = t('models.catalog.disconnected', '') + (prior ? (' (' + t('models.catalog.stale', 'Last refreshed') + ' ' + new Date(prior.refreshedAt).toLocaleTimeString() + ')') : '') + ' — ' + snap.detail;
          S.notify.warn(t('models.catalog.disconnected', '') + ' ' + snap.detail);
        }
        return snap;
      });
    }
    refreshBtn.addEventListener('click', doRefresh);

    /* Paint whatever is already known (offline-safe: last verified
       state, never a guessed new entry) before the first live refresh
       completes. */
    var existing = M.lastSnapshot();
    if (existing) {
      lastCatalogState = existing.state;
      refreshSuggestions();
      paintCatalogList();
      var age = M.snapshotAgeMs(existing);
      statusLine.textContent = t('models.catalog.stale', 'Last refreshed') + ': ' + new Date(existing.refreshedAt).toLocaleTimeString() +
        (age !== null ? (' (' + M.fmtDuration(age) + ' ago)') : '');
    } else {
      refreshSuggestions();
      paintCatalogList();
      statusLine.textContent = t('models.state.unknown', 'Not checked yet.');
    }

    S.i18n.apply(panel);
  }

  /* ================================================================
   * 7. Pull queue
   * ================================================================ */
  var pullListNode = null;
  function renderPull(panel) {
    clear(panel);
    panel.appendChild(el('h2', { 'data-i18n': 'models.tab.pull' }));
    panel.appendChild(el('p', { class: 'muted', text: 'Progress is byte-accurate whenever the runtime reports totals. A failed item stays failed on its own row -- it never turns the rest of the batch green.' }));

    var clearBtn = el('button', { class: 'btn btn--outlined', type: 'button', text: t('models.pull.clearFinished', 'Clear finished') });
    clearBtn.addEventListener('click', function () { var n = M.clearFinishedPulls(); S.notify.success('Cleared ' + n + ' finished item(s).'); paintPull(); });
    panel.appendChild(el('div', { class: 'mdl-row' }, [clearBtn]));

    pullListNode = el('ul', { class: 'mdl-list', role: 'listbox', 'aria-label': 'Pull queue', 'aria-multiselectable': 'true' });
    panel.appendChild(pullListNode);

    S.bulk.attach(pullListNode, {
      itemSelector: '[data-bulk-item]',
      getLabel: function (id) { var it = M.pullItems().filter(function (i) { return i.id === id; })[0]; return it ? it.name : id; },
      allMatchingCount: function () { return M.pullItems().length; },
      allMatchingIds: function () { return M.pullItems().map(function (i) { return i.id; }); },
      actions: [
        { id: 'cancel', label: t('models.pull.cancel', 'Cancel'), run: function (ids) {
          var done = 0, skipped = 0;
          ids.forEach(function (id) { var r = M.cancelPull(id); if (r.ok) done++; else skipped++; });
          return { done: done, skipped: skipped, reason: skipped ? 'Some items were not active or queued, so there was nothing to cancel.' : undefined };
        } },
        { id: 'retry', label: t('models.pull.retry', 'Retry'), run: function (ids) {
          var done = 0, skipped = 0;
          ids.forEach(function (id) { var r = M.retryPull(id); if (r.ok) done++; else skipped++; });
          return { done: done, skipped: skipped };
        } },
        { id: 'remove', label: t('models.pull.remove', 'Remove'), destructive: true, run: function (ids) {
          var done = 0, skipped = 0;
          ids.forEach(function (id) { var r = M.removePullItem(id); if (r.ok) done++; else skipped++; });
          return { done: done, skipped: skipped, reason: skipped ? 'Active or queued items cannot be removed -- cancel them first.' : undefined };
        } }
      ]
    });

    function paintPull() {
      clear(pullListNode);
      var items = M.pullItems();
      if (!items.length) { pullListNode.appendChild(el('li', { class: 'note', text: t('models.pull.empty', '') })); S.i18n.apply(pullListNode); return; }
      items.forEach(function (it) {
        var fraction = it.totalBytes ? clampFraction(it.completedBytes / it.totalBytes) : 0;
        var checkbox = el('span', { class: 'cbx', 'data-bulk-check': '', role: 'checkbox', 'aria-checked': 'false', 'aria-label': 'Select ' + it.name });
        var statusCls = it.status === 'done' ? 'status--ok' : (it.status === 'failed' ? 'status--error' : (it.status === 'active' ? 'status--warn' : ''));
        var row = el('li', { class: 'mdl-item', 'data-bulk-item': '', 'data-id': it.id, tabindex: '0', role: 'option', 'aria-selected': 'false' }, [
          el('div', { class: 'mdl-item__top' }, [
            checkbox, el('span', { class: 'mdl-item__name', text: it.name }),
            el('span', { class: 'status ' + statusCls, text: it.statusText || it.status })
          ]),
          (it.status === 'active') ? progressBar(fraction, !it.totalBytes) : null,
          el('div', { class: 'mdl-item__meta' }, [
            el('span', { text: M.fmtBytes(it.completedBytes) + (it.totalBytes ? (' of ' + M.fmtBytes(it.totalBytes)) : '') }),
            el('span', { text: 'Attempts: ' + it.attempts })
          ]),
          it.error ? el('p', { class: 'note note--warn', text: 'Error: ' + it.error }) : null,
          it.note ? el('p', { class: 'note', text: it.note }) : null,
          el('div', { class: 'mdl-item__actions' }, [
            (it.status === 'active' || it.status === 'queued') ? el('button', { class: 'btn btn--text', type: 'button', text: t('models.pull.cancel', 'Cancel'), onclick: function () { M.cancelPull(it.id); } }) : null,
            (it.status === 'failed' || it.status === 'cancelled' || it.status === 'interrupted') ? el('button', { class: 'btn btn--text', type: 'button', text: t('models.pull.retry', 'Retry'), onclick: function () { M.retryPull(it.id); } }) : null,
            (it.status !== 'active' && it.status !== 'queued') ? el('button', { class: 'btn btn--text', type: 'button', text: t('models.pull.remove', 'Remove'), onclick: function () { M.removePullItem(it.id); } }) : null
          ])
        ]);
        pullListNode.appendChild(row);
      });
      S.i18n.apply(pullListNode);
    }
    function clampFraction(n) { return isNaN(n) ? 0 : Math.max(0, Math.min(1, n)); }

    M.loadPullQueue();
    paintPull();
    M.onPullChange(function () { if (strip.selected() === 'pull' || pullListNode.isConnected) paintPull(); });
  }

  /* ================================================================
   * 8. Chat
   * ================================================================ */
  var chatRefs = { activeId: null };
  function renderChat(panel) {
    clear(panel);
    panel.appendChild(el('h2', { 'data-i18n': 'models.tab.chat' }));

    var sessionSearch = S.createSearchBar({
      ariaLabel: 'Search chat sessions', placeholder: 'Search chats', storageKey: 'models-chat-search',
      help: 'Searches chat titles.',
      sampleProvider: function () { return M.listChatSessions().map(function (s) { return s.title; }).join('\n'); },
      onChange: function () { paintSessions(); }
    });

    var newBtn = el('button', { class: 'btn btn--filled', type: 'button', text: t('models.chat.new', 'New chat') });
    var sessionsList = el('ul', { class: 'mdl-list', role: 'listbox', 'aria-label': 'Chat sessions', 'aria-multiselectable': 'true' });
    var sessionsCol = el('div', { class: 'mdl-chat__sessions' }, [newBtn, sessionSearch.el, sessionsList]);
    var mainCol = el('div', { class: 'mdl-chat__main' });
    var grid = el('div', { class: 'mdl-chat' }, [sessionsCol, mainCol]);
    panel.appendChild(grid);

    S.bulk.attach(sessionsList, {
      itemSelector: '[data-bulk-item]',
      getLabel: function (id) { var s = M.getChatSession(id); return s ? s.title : id; },
      allMatchingCount: function () { return M.listChatSessions().length; },
      allMatchingIds: function () { return M.listChatSessions().map(function (s) { return s.id; }); },
      actions: [
        { id: 'export', label: t('act.export', 'Export'), run: function (ids) {
          var rows = M.listChatSessions().filter(function (s) { return ids.indexOf(s.id) >= 0; }).map(function (s) {
            return { id: s.id, title: s.title, model: s.model, messageCount: s.messages.length, updatedAt: s.updatedAt,
              transcript: s.messages.map(function (m) { return m.role + ': ' + m.content; }).join('\n---\n') };
          });
          S.exportDialog(rows, { name: 'chat-sessions', anchor: sessionsList, omitted: 'Nothing is redacted from this export; it is entirely local already.' });
          return { done: rows.length, skipped: 0 };
        } },
        { id: 'delete', label: t('act.remove', 'Delete'), danger: true, destructive: true, run: function (ids) {
          ids.forEach(function (id) { M.deleteChatSession(id); if (chatRefs.activeId === id) chatRefs.activeId = null; });
          paintSessions(); renderActiveSession();
          return { done: ids.length, skipped: 0 };
        } }
      ]
    });

    function paintSessions() {
      clear(sessionsList);
      var sessions = M.listChatSessions();
      var list = sessionSearch.value() ? sessions.filter(function (s) { return sessionSearch.matcher()(s.title); }) : sessions;
      if (!list.length) { sessionsList.appendChild(el('li', { class: 'note', text: t('models.chat.empty', '') })); return; }
      list.forEach(function (s) {
        var checkbox = el('span', { class: 'cbx', 'data-bulk-check': '', role: 'checkbox', 'aria-checked': 'false', 'aria-label': 'Select ' + s.title });
        var row = el('li', {
          class: 'li li--action', 'data-bulk-item': '', 'data-id': s.id, tabindex: '0', role: 'option',
          'aria-selected': String(chatRefs.activeId === s.id), onclick: function () { chatRefs.activeId = s.id; renderActiveSession(); paintSessions(); }
        }, [
          checkbox,
          el('div', { class: 'li__t' }, [
            el('div', { class: 'li__h', text: s.title }),
            el('div', { class: 'li__s', text: (s.model || 'no model') + ' · ' + s.messages.length + ' message(s)' })
          ])
        ]);
        if (chatRefs.activeId === s.id) row.classList.add('is-sel');
        sessionsList.appendChild(row);
      });
    }

    newBtn.addEventListener('click', function () {
      var installed = catalogNames();
      var s = M.newChatSession(installed[0] || null);
      chatRefs.activeId = s.id;
      paintSessions(); renderActiveSession();
    });

    function catalogNames() {
      var snap = M.lastSnapshot();
      return ((snap && snap.entries) || []).map(function (e) { return e.name; });
    }

    var stopFn = null;
    function renderActiveSession() {
      clear(mainCol);
      var s = chatRefs.activeId ? M.getChatSession(chatRefs.activeId) : null;
      if (!s) { mainCol.appendChild(el('p', { class: 'note', text: t('models.chat.empty', '') })); return; }

      var names = catalogNames();
      var modelSelect = S.createSelect({
        ariaLabel: 'Model for this chat', storageKey: null, value: s.model || (names[0] || ''),
        options: names.length ? names.map(function (n) { return { value: n, label: n }; }) : [{ value: '', label: 'No installed models' }],
        onChange: function (v) { M.updateChatSession(s.id, { model: v }); refreshAttachState(); }
      });

      var systemPromptBox = el('textarea', { class: 'mdl-native', rows: '2', 'aria-label': t('models.chat.systemPrompt', 'System prompt'), value: s.systemPrompt || '' });
      systemPromptBox.addEventListener('change', function () { M.updateChatSession(s.id, { systemPrompt: systemPromptBox.value }); });

      var paramsHost = el('div', { class: 'mdl-fields' });
      var params = M.clampParams(s.params);
      Object.keys(M.PARAM_BOUNDS).forEach(function (key) {
        var b = M.PARAM_BOUNDS[key];
        var slider = S.makeSlider({
          min: b.min, max: b.max, step: b.step, value: params[key], ariaLabel: key,
          format: function (v) { return String(v); },
          onChange: function (v) { var p = M.clampParams(s.params); p[key] = v; M.updateChatSession(s.id, { params: p }); }
        });
        paramsHost.appendChild(el('label', { class: 'stack', style: { gap: '4px' } }, [el('span', { class: 't-label-small', text: key }), slider]));
      });
      var paramsWrap = el('div'); paramsWrap.appendChild(paramsHost);
      var paramsBox = S.collapse.attach(paramsWrap, { title: t('models.chat.params', 'Parameters'), descriptive: true, storageKey: 'models-chat-params-' + s.id.slice(0, 8) });

      var thread = el('div', { class: 'mdl-thread', role: 'log', 'aria-live': 'polite', 'aria-label': 'Conversation' });
      function paintThread(pendingAssistant) {
        clear(thread);
        s.messages.forEach(function (m) {
          thread.appendChild(el('div', { class: 'mdl-msg mdl-msg--' + (m.role === 'user' ? 'user' : m.role === 'assistant' ? 'assistant' : 'system'), text: m.content }));
        });
        if (pendingAssistant !== undefined) thread.appendChild(el('div', { class: 'mdl-msg mdl-msg--assistant', text: pendingAssistant || '…' }));
        thread.scrollTop = thread.scrollHeight;
      }
      paintThread();

      var attachBtn = el('button', { class: 'btn btn--icon', type: 'button', 'aria-label': 'Attach an image' }, icon('upload'));
      var attachInput = el('input', { type: 'file', accept: 'image/*', class: 'visually-hidden', 'aria-hidden': 'true' });
      var attachNote = el('span', { class: 'muted t-body-small' });
      var pendingImage = null;
      function refreshAttachState() {
        M.showModel(modelSelect.value()).then(function (resp) {
          var caps = M.modelCapabilities(resp);
          attachBtn.disabled = !caps.vision;
          attachBtn.title = caps.vision ? 'Attach an image' : (t('models.chat.attach.disabled', '') + ' ' + caps.note);
        }, function () {
          attachBtn.disabled = true;
          attachBtn.title = t('models.chat.attach.disabled', '') + ' Could not confirm capabilities right now.';
        });
      }
      attachBtn.addEventListener('click', function () { attachInput.click(); });
      attachInput.addEventListener('change', function () {
        var file = attachInput.files && attachInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () { pendingImage = String(reader.result).split(',')[1]; attachNote.textContent = 'Attached: ' + file.name; };
        reader.readAsDataURL(file);
      });

      var textarea = el('textarea', { class: 'mdl-native', 'aria-label': 'Message', placeholder: 'Message' });
      var sendBtn = el('button', { class: 'btn btn--filled', type: 'button', text: t('models.chat.send', 'Send') });
      var stopBtn = el('button', { class: 'btn btn--outlined', type: 'button', text: t('models.chat.stop', 'Stop'), disabled: true });
      var regenBtn = el('button', { class: 'btn btn--text', type: 'button', text: t('models.chat.regenerate', 'Regenerate') });

      function setBusy(busy) {
        sendBtn.disabled = busy; textarea.disabled = busy; stopBtn.disabled = !busy; regenBtn.disabled = busy || !s.messages.length;
      }

      function doSend(text) {
        if (!text || !text.trim()) return;
        if (!modelSelect.value()) { S.notify.error(t('models.chat.needModel', '')); return; }
        setBusy(true);
        var images = pendingImage ? [pendingImage] : undefined;
        pendingImage = null; attachNote.textContent = '';
        stopFn = M.sendChatMessage(s.id, text, images,
          function onDelta(acc) { paintThread(acc); },
          function onDone() { setBusy(false); stopFn = null; s = M.getChatSession(s.id); paintThread(); },
          function onError(err) { setBusy(false); stopFn = null; S.notify.error((err && err.message) || String(err)); s = M.getChatSession(s.id); paintThread(); }
        );
      }
      sendBtn.addEventListener('click', function () { var v = textarea.value; textarea.value = ''; doSend(v); });
      textarea.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } });
      stopBtn.addEventListener('click', function () { if (stopFn) stopFn(); });
      regenBtn.addEventListener('click', function () {
        var msgs = s.messages.slice();
        var lastUser = null;
        while (msgs.length && msgs[msgs.length - 1].role !== 'user') msgs.pop();
        if (!msgs.length) return;
        lastUser = msgs[msgs.length - 1];
        M.updateChatSession(s.id, { messages: msgs.slice(0, -1) });
        s = M.getChatSession(s.id);
        doSend(lastUser.content);
      });

      var titleInput = el('input', { class: 'mdl-native', type: 'text', value: s.title, 'aria-label': 'Chat title' });
      titleInput.addEventListener('change', function () { M.updateChatSession(s.id, { title: titleInput.value || 'Untitled' }); paintSessions(); });

      S.append(mainCol, [
        el('div', { class: 'mdl-row' }, [titleInput, modelSelect.el]),
        !names.length ? el('p', { class: 'note note--warn', text: t('models.chat.needModel', '') }) : null,
        el('label', { class: 'stack', style: { gap: '4px' } }, [el('span', { class: 't-label-small', text: t('models.chat.systemPrompt', 'System prompt') }), systemPromptBox]),
        paramsWrap,
        thread,
        el('div', { class: 'mdl-compose' }, [
          attachBtn, attachInput, textarea, sendBtn, stopBtn, regenBtn
        ]),
        attachNote
      ]);
      refreshAttachState();
    }

    paintSessions();
    renderActiveSession();
  }

  /* ================================================================
   * 9. Harness (desktop-only, listed and disabled)
   * ================================================================ */
  function renderHarness(panel) {
    clear(panel);
    panel.appendChild(el('h2', { 'data-i18n': 'models.tab.harness' }));
    panel.appendChild(el('p', { class: 'muted', 'data-i18n': 'models.harness.note' }));
    var list = el('ul', { class: 'mdl-list' });

      list.appendChild(el('li', { class: 'mdl-item' }, [
        el('div', { class: 'mdl-item__top' }, [

          chip('Desktop only', 'status--warn')
        ]),
        el('button', { class: 'btn btn--filled', type: 'button', text: 'Launch', disabled: true, title: p.disabledReason }),
        el('p', { class: 'muted t-body-small', text: p.disabledReason })
      ]));
    });

    ]));

  /* ================================================================
   * 10. Page-level search bar (search everything on this page)
   * ================================================================ */
  var searchIndex = [
    { id: 'models.search.overview', tabId: 'overview', label: 'Connection and runtime address' },
    { id: 'models.search.catalog', tabId: 'catalog', label: 'Installed model catalog' },
    { id: 'models.search.pull', tabId: 'pull', label: 'Pull queue' },
    { id: 'models.search.chat', tabId: 'chat', label: 'Local chat' },
    { id: 'models.search.harness', tabId: 'harness', label: 'Harness launch' }
  ];
  var search;
  function buildSearch() {
    var host = document.getElementById('search-host');
    var results = document.getElementById('search-results');
    search = S.createSearchBar({
      ariaLabel: 'Search this page', placeholder: 'Search connection, catalog, pull queue, chat, harness',
      storageKey: 'models-page', help: 'Searches the section names on this page and reports which tab a match sits on.',
      sampleProvider: function () { return searchIndex.map(function (r) { return r.label; }).join('\n'); },
      onChange: function () { paintSearchResults(); }
    });
    host.appendChild(search.el);
    function paintSearchResults() {
      var q = search.value();
      if (!q) { results.hidden = true; clear(results); return; }
      var m = search.matcher();
      var hits = searchIndex.filter(function (r) { return m(r.label); });
      clear(results); results.hidden = false;
      if (!hits.length) { results.appendChild(el('p', { class: 'note', text: t('msg.noMatch', 'No matches.') })); return; }
      hits.forEach(function (r) {
        results.appendChild(el('button', {
          class: 'btn btn--outlined', type: 'button', style: { margin: '4px 6px 4px 0' },
          text: r.label + ' (' + TAB_LABELS[r.tabId] + ')',
          onclick: function () { strip.select(r.tabId); results.hidden = true; search.setValue(''); }
        }));
      });
    }
  }

  /* ================================================================
   * 11. Command palette registration
   * ================================================================ */
  function registerPalette() {
    var items = [
      { id: 'page.models', title: t('models.title', 'Local models'), kind: 'page', keywords: 'ollama model runtime catalog pull chat harness', page: 'models.html' }
    ];
    TABS.forEach(function (tb) {
      items.push({ id: 'models.tab.' + tb.id, title: TAB_LABELS[tb.id], kind: 'destination', keywords: tb.keywords, page: 'models.html', tabStrip: 'models', tabId: tb.id });
    });
    items.push({
      id: 'models.setting.baseUrl', title: t('models.baseUrl.label', 'Runtime address'), subtitle: t('models.title', 'Local models'), kind: 'setting',
      target: '#models-base-url', page: 'models.html',
      control: function () {
        var input = el('input', { class: 'mdl-native', type: 'text', value: M.getBaseUrl(), 'aria-label': t('models.baseUrl.label', 'Runtime address') });
        input.addEventListener('change', function () { M.setBaseUrl(input.value); });
        return input;
      }
    });
    S.palette.register(items);
  }

  /* ================================================================
   * 12. Boot
   * ================================================================ */
  paintPageCopy();
  buildAppbarActions();
  buildSearch();
  renderOverview(panels.overview);
  renderCatalog(panels.catalog);
  renderPull(panels.pull);
  renderChat(panels.chat);
  renderHarness(panels.harness);
  registerPalette();

  S.on('i18n', function () {
    paintPageCopy(); buildAppbarActions();
    TABS.forEach(function (tb) { TAB_LABELS[tb.id] = t(tb.labelKey, tb.id); });
  });

  S.appearance.enable(document.getElementById('page-title'), 'models:title', 'The local models page heading');
  S.contextMenu(document.getElementById('page-title'), function () {
    return [
      { label: t('act.openEditor', 'Edit appearance') + '…', icon: 'palette', shortcut: 'Shift+Right click',
        run: function () { S.appearance.openEditor(document.getElementById('page-title'), 'models:title', 'The local models page heading'); } },
      { label: t('locks.lockThis', 'Lock this element') + '…', icon: 'lock',
        run: function () { S.locks.wizard(document.getElementById('page-title'), 'models:title', 'The local models page heading'); } }
    ];
  }, { ariaLabel: 'Page heading menu' });
});
});
</script>
</body>
